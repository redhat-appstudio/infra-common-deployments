name: Lint manifests with yamllint

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint yaml manifests
        run: |
          yamllint -f github .
