---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac
patches:
  - path: patches/everyone-can-view-patch.yaml
    target:
      # all "view" CRBs + dev-can-sync, but NOT konflux-admins
      name: ^(dev-can-sync|everyone-view|everyone-view-cluster-version|everyone-view-pac-repositories|everyone-view-cluster-monitoring|everyone-view-compute)$
      kind: ClusterRoleBinding
      group: rbac.authorization.k8s.io
      version: v1
