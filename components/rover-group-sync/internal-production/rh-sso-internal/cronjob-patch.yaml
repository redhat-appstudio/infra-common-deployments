apiVersion: batch/v1
kind: CronJob
metadata:
  name: rover-group-sync
  namespace: rover-group-sync
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: rover-group-sync
              env:
                - name: USERNAME_PREFIX
                  value: ""
                - name: IDENTITY_PROVIDER
                  value: "rh-sso-internal"
