apiVersion: appstudio.redhat.com/v1alpha1
kind: InternalServicesConfig
metadata:
  name: config
spec:
  allowList:
  - rhtap-releng-tenant
  - rh-managed-cnv-fbc-tenant
  - rh-managed-red-hat-acm-tenant
  allowedGitResolverURLs:
  - https://github.com/konflux-ci/release-service-catalog
  - https://github.com/konflux-ci/release-service-catalog.git
  debug: true
  volumeClaim:
    name: pipeline
    size: 1Gi
