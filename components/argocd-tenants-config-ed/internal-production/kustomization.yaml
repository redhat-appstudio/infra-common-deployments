apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd-tenants-config

resources:
  - shared-resources-ref
  - appprojects
  - appsets
  - external-secrets

patches:
  - path: patches/argocd-controller-memory-limit-patch.yaml
    target:
      group: argoproj.io
      version: v1beta1
      kind: ArgoCD
      name: argocd-tenants-config
  - path: patches/argocd-controller-memory-request-patch.yaml
    target:
      group: argoproj.io
      version: v1beta1
      kind: ArgoCD
      name: argocd-tenants-config
  - path: patches/argocd-controller-sharding-replica-patch.yaml
    target:
      group: argoproj.io
      version: v1beta1
      kind: ArgoCD
      name: argocd-tenants-config
