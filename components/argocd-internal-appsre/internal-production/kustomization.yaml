  - path: patches/argocd-repo-env-patch.yaml
    target:
      group: argoproj.io
      version: v1beta1
      kind: ArgoCD
      name: argocd
  - path: patches/argocd-server-memory-limit-patch.yaml
    target:
      group: argoproj.io
      version: v1beta1
      kind: ArgoCD
      name: argocd
  - path: patches/argocd-redis-memory-limit-patch.yaml
    target:
      group: argoproj.io
      version: v1beta1
      kind: ArgoCD
      name: argocd
  - path: patches/argocd-redis-requests-patch.yaml
