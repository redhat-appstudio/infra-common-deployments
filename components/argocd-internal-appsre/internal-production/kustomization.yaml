apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - ../base
  - ns.yaml
  - external-secrets
  - all-application-sets-application.yaml

patches:
  - path: patches/argocd-controller-sharding-replica-patch.yaml
    target:
      group: argoproj.io
      version: v1beta1
      kind: ArgoCD
  - path: patches/argocd-namespace-patch.yaml
    target:
      group: argoproj.io
      version: v1beta1
      kind: ArgoCD
      name: argocd
