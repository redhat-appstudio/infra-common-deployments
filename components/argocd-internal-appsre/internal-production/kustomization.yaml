    target:
      group: argoproj.io
      version: v1beta1
      kind: ArgoCD
      name: argocd
  - path: patches/argocd-controller-memory-request-patch.yaml
    target:
      group: argoproj.io
      version: v1beta1
      kind: ArgoCD
      name: argocd
  - path: patches/argocd-controller-env-patch.yaml
    target:
      group: argoproj.io
      version: v1beta1
      kind: ArgoCD
      name: argocd
  - path: patches/argocd-controller-sharding-replica-patch.yaml
    target:
      group: argoproj.io
      version: v1beta1
      kind: ArgoCD
  - path: patches/argocd-namespace-patch.yaml
    target:
      group: argoproj.io
      version: v1beta1
      kind: ArgoCD
      name: argocd
  - path: patches/argocd-repo-memory-limit-patch.yaml
    target:
      group: argoproj.io
      version: v1beta1
      kind: ArgoCD
      name: argocd
  - path: patches/argocd-repo-requests-patch.yaml
    target:
      group: argoproj.io
      version: v1beta1
      kind: ArgoCD
      name: argocd
  - path: patches/argocd-repo-replicas-patch.yaml
    target:
