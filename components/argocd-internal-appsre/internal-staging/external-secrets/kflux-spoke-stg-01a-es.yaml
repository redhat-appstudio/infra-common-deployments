apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kflux-spoke-stg-01a-es
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    argocd.argoproj.io/secret-type: cluster
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: staging/platform/terraform/generated/kflux-hub-stg-01/kflux-spoke-stg-01a
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: appsre-stonesoup-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    name: kflux-spoke-stg-01a-secret
    template:
      engineVersion: v2
      # Keep Replace (not Merge): ApplicationSet-selecting labels must match this
      # template exactly. Merge can leave stale labels on the Secret after removals
      # (see #942), so Apps keep matching when they should not.
      mergePolicy: Replace
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
          appstudio.redhat.com/host-cluster: 'true'
          appstudio.redhat.com/member-cluster: 'true'
          appstudio.redhat.com/internal-member-cluster: "true"
          appstudio.redhat.com/toolchain-member: 'true'
