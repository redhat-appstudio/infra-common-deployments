apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-rollouts-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: argocd
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - rolloutmanagers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
