apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-kube-state-metrics-config
  namespace: appstudio-monitoring
data:
  custom-resource-state.yaml: |
    spec:
      resources:
        # Stage names are stable: ring-<n>-<component>. Promotion ids stay off
        # these labels. Phase and health are strings, so they are labels and the
        # gauge value is a timestamp or the object generation.
        - groupVersionKind:
            group: kargo.akuity.io
            version: v1alpha1
            kind: Stage
          metricNamePrefix: kargo_stage
          labelsFromPath:
            name: [metadata, name]
            namespace: [metadata, namespace]
          metrics:
            - name: last_promotion_finished_timestamp
              help: "Unix time when this Stage last finished a promotion."
              each:
                type: Gauge
                gauge:
                  path: [status, lastPromotion]
                  labelsFromPath:
                    phase: [status, phase]
                  valueFrom: [finishedAt]
            - name: current_promotion_started_timestamp
              help: "Unix time when the in-progress promotion started. Absent while the Stage is idle."
              each:
                type: Gauge
                gauge:
                  path: [status, currentPromotion]
                  labelsFromPath:
                    phase: [status, phase]
                  valueFrom: [status, startedAt]
            - name: health
              help: "Stage object generation. The health label is status.health.status."
              labelsFromPath:
                health: [status, health, status]
              each:
                type: Gauge
                gauge:
                  path: [metadata, generation]
            - name: condition_last_transition_timestamp
              help: "Unix time of the last transition for a Stage condition."
              each:
                type: Gauge
                gauge:
                  path: [status, conditions]
                  labelsFromPath:
                    condition: [type]
                    status: [status]
                  valueFrom: [lastTransitionTime]
            # source is the map key. It is not on the remote-write allowlist, so the label will be dropped and won't get federated to RHOBS.
            # origin_kind and origin_name are kept.
            # https://docs.kargo.io/api-docs#tag/core/GET/v1beta1/projects/{project}/stages/{stage}:~:text=%7D%2C%0A%20%20%20%20%22-,effectiveAutoPromotionHolds,-%22%3A%20%7B
            - name: effective_auto_promotion_hold_created_timestamp
              help: "Unix time when the Promotion that established this auto-promotion hold was created."
              each:
                type: Gauge
                gauge:
                  path: [status, effectiveAutoPromotionHolds]
                  labelFromKey: source
                  labelsFromPath:
                    origin_kind: [origin, kind]
                    origin_name: [origin, name]
                  valueFrom: [createdAt]
        - groupVersionKind:
            group: kargo.akuity.io
            version: v1alpha1
            kind: Warehouse
          metricNamePrefix: kargo_warehouse
          labelsFromPath:
            name: [metadata, name]
            namespace: [metadata, namespace]
          metrics:
            - name: condition_last_transition_timestamp
              help: "Unix time of the last transition for a Warehouse condition."
              each:
                type: Gauge
                gauge:
                  path: [status, conditions]
                  labelsFromPath:
                    condition: [type]
                    status: [status]
                  valueFrom: [lastTransitionTime]
            # A Warehouse can show a FreightCreated condition and its
            # lastTransitionTime. That time is not when artifacts were last
            # discovered. This gauge uses status.discoveredArtifacts.discoveredAt.
            - name: discovered_timestamp
              help: "Unix time when this Warehouse last discovered artifacts."
              each:
                type: Gauge
                gauge:
                  path: [status, discoveredArtifacts]
                  valueFrom: [discoveredAt]
