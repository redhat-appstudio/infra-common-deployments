apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kargo-verification
  namespace: openshift-user-workload-monitoring
spec:
  groups:
    - name: kargo_verification
      interval: 1m
      rules:
        # Live AnalysisRun count per Kargo project, component, ring, and phase.
        # Drops unique AnalysisRun names (promotion-id.freight-sha).
        - record: kargo:verification:count
          expr: |
            sum by (exported_namespace, component, stage, phase) (
              label_replace(
                label_replace(
                  analysis_run_phase{namespace="argo-rollouts"},
                  "component", "$1", "name", "ring-[0-9]+-([^.]+)\\..*"
                ),
                "stage", "$1", "name", "(ring-[0-9]+)-.*"
              )
            )
