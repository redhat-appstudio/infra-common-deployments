---
# Route ip_whitelist for the external staging smee server.
#
# This annotation is applied to the OpenShift Route that fronts gosmee. HAProxy
# only accepts clients whose source IP is listed. That includes:
#   1) SCM webhook publishers (GitHub / GitLab.com) POSTing events into smee
#   2) Private-cluster smee clients / health-check sidecars (NAT / egress IPs)
#
# Sources:
#   [1] GitHub hooks: https://api.github.com/meta -> .hooks
#       https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-githubs-ip-addresses
#   [2] GitLab.com: https://docs.gitlab.com/ee/user/gitlab_com/#ip-range
#
# IMPORTANT: the annotation value must be a single-space-separated list of IPs
# and CIDRs. Do not put comments or blank lines inside the `value:` folded
# block — YAML would treat them as part of the string and OpenShift would
# ignore/break the whitelist. Keep group documentation here, and keep the
# `value:` entries in the same order as the groups below.
#
# --- Group order in `value:` (do not reorder casually) ---
#
# GitHub webhook source ranges [1]:
#   192.30.252.0/22
#   185.199.108.0/22
#   140.82.112.0/20
#   143.55.64.0/20
#   9.234.106.48/28
#   9.234.98.160/28
#   9.234.98.176/28
#   2a0a:a440::/29
#   2606:50c0::/32
#
# GitLab.com webhook source ranges [2]:
#   34.74.90.64/28
#   34.74.226.0/24
#
# Private-cluster NAT / egress IPs (smee client + health-check sidecar):
#   pentest-p01:
#     107.21.230.162 52.70.180.31 34.234.55.39
#   kflux-stg-p02:
#     169.63.96.104 169.63.190.113 52.117.122.201 100.63.94.234
#   stone-stage-p01 (active + standby NAT):
#     107.21.237.46 107.23.223.171 23.23.229.59
#     3.213.189.253 98.90.169.75
- op: add
  path: /metadata/annotations/haproxy.router.openshift.io~1ip_whitelist
  value: >-
    192.30.252.0/22
    185.199.108.0/22
    140.82.112.0/20
    143.55.64.0/20
    9.234.106.48/28
    9.234.98.160/28
    9.234.98.176/28
    2a0a:a440::/29
    2606:50c0::/32
    34.74.90.64/28
    34.74.226.0/24
    107.21.230.162
    52.70.180.31
    34.234.55.39
    169.63.96.104
    169.63.190.113
    52.117.122.201
    100.63.94.234
    107.21.237.46
    107.23.223.171
    23.23.229.59
    3.213.189.253
    98.90.169.75
