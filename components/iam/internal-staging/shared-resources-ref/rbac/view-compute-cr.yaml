kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: view-compute
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - 'machine.openshift.io'
  resources:
  - machines
  - machinesets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - 'autoscaling.openshift.io'
  resources:
  - machineautoscalers
  verbs:
  - get
  - list
  - watch
  # On EaaS clusters, where Cluster as a service operator is installed, this
  # permission is needed to list the nodes
- apiGroups:
  - certificates.k8s.io
  resources:
  - certificatesigningrequests
  verbs:
  - get
  - watch
  - list
