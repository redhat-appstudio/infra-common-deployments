---
# ClusterRole with the permissions every Kargo project namespace needs.
# Namespaced RoleBindings below scope these to individual namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kargo-shard-staging-project-access
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
# --- kargo-shared-resources ---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kargo-shard-staging-project-access
  namespace: kargo-shared-resources
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kargo-shard-staging-project-access
subjects:
  - kind: ServiceAccount
    name: kargo-shard-staging
    namespace: kargo
---
# --- kargo-infra-common ---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kargo-shard-staging-project-access
  namespace: kargo-infra-common
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kargo-shard-staging-project-access
subjects:
  - kind: ServiceAccount
    name: kargo-shard-staging
    namespace: kargo
---
# --- kargo-infra-deployments ---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kargo-shard-staging-project-access
  namespace: kargo-infra-deployments
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kargo-shard-staging-project-access
subjects:
  - kind: ServiceAccount
    name: kargo-shard-staging
    namespace: kargo
---
# --- kargo-konflux-core ---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kargo-shard-staging-project-access
  namespace: kargo-konflux-core
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kargo-shard-staging-project-access
subjects:
  - kind: ServiceAccount
    name: kargo-shard-staging
    namespace: kargo
---
# --- kargo-konflux-infrastructure ---
apiVersion: rbac.authorization.k8s.io/v1
