---
# PipelineRun template for conformance-konflux-e2e AnalysisTemplate.
#
# The launcher Job reads this ConfigMap and replaces placeholders:
#   __RUN_ID__        → unique run identifier (e.g. conformance-stone-stage-p01-a3f1bc09)
#   __RUNNER_NS__     → namespace where PipelineRun executes and SA lives
#   __APP_NS__        → namespace where test applications are created
#   __GITHUB_TOKEN__  → GitHub PAT for private test repos
apiVersion: v1
kind: ConfigMap
metadata:
  name: conformance-pipelinerun-template
data:
  template.yaml: |
    apiVersion: tekton.dev/v1
    kind: PipelineRun
    metadata:
      name: __RUN_ID__
      namespace: __RUNNER_NS__
      labels:
        app.kubernetes.io/part-of: kargo-conformance
        kargo.akuity.io/verification: "true"
    spec:
      timeouts:
        pipeline: 50m
      taskRunTemplate:
        serviceAccountName: conformance-test-runner
      pipelineSpec:
        tasks:
        - name: run-conformance-tests
          taskSpec:
            steps:
            - name: tests
              image: quay.io/konflux-ci/conformance-tests:latest
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
              computeResources:
                requests:
                  memory: 4Gi
                  cpu: "2"
                limits:
                  memory: 8Gi
                  cpu: "4"
              env:
              - name: E2E_APPLICATIONS_NAMESPACE
                value: __APP_NS__
              - name: E2E_MANAGED_NAMESPACE
                value: __RUNNER_NS__
              - name: MY_GITHUB_ORG
                value: konflux-ci
              - name: E2E_REPO
                value: testrepo-private
              - name: E2E_ITS_REPO
                value: testrepo
              - name: TEST_ENVIRONMENT
                value: upstream
              - name: GITHUB_TOKEN
                value: __GITHUB_TOKEN__
              command:
              - /usr/local/bin/conformance.test
              args:
              - -ginkgo.vv
              - -test.timeout
              - 45m
              - -test.count
              - "1"
