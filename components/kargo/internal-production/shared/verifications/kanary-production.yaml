---
# Kanary verification against production Observatorium (RHOBS). Stages pass clusters as a PromQL regex and expected-cluster-count.
#
# The monitoring duration is customizable per stage via the initial-delay, check-interval, check-count, and
# failure-limit args. Defaults: 40m delay + 1 check × 40m = ~1.3h monitoring (single pass required).
#
# Example Stage spec.verification:
#   analysisTemplates:
#     - name: kanary-production
#   args:
#     - name: clusters
#       value: kflux-ocp-p01|kflux-prd-rh02
#     - name: expected-cluster-count
#       value: "2"
#     - name: check-count           # optional: override for longer monitoring
#       value: "48"                  # 48 × 40m = ~32h
#     - name: failure-limit
#       value: "9"                   # 80% pass rate for extended runs
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: kanary-production
spec:
  args:
    - name: clusters
    - name: expected-cluster-count
    - name: namespace
      value: konflux-otel
    - name: types
      value: container-single-arch
    - name: initial-delay
      value: "40m"
    - name: check-interval
      value: "40m"
    - name: check-count
      value: "1"
    - name: failure-limit
      value: "1"
    - name: prometheus-address
      value: https://observatorium-mst.api.openshift.com/api/metrics/v1/rhtap
    - name: token-url
      value: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
    - name: oauth-client-id
      valueFrom:
        secretKeyRef:
          name: kargo-rhobs-production
          key: client_id
    - name: oauth-client-secret
      valueFrom:
        secretKeyRef:
          name: kargo-rhobs-production
          key: client_secret
  metrics:
    - name: kanary-up
      initialDelay: "{{args.initial-delay}}"
      interval: "{{args.check-interval}}"
      count: "{{args.check-count}}"
      failureLimit: "{{args.failure-limit}}"
      successCondition: len(result) > 0 && result[0] == {{args.expected-cluster-count}}
      provider:
        prometheus:
          address: "{{args.prometheus-address}}"
          timeout: 40
          authentication:
            oauth2:
              tokenUrl: "{{args.token-url}}"
              clientId: "{{args.oauth-client-id}}"
              clientSecret: "{{args.oauth-client-secret}}"
              scopes:
                - profile
          query: |
            count(
              min by (tested_cluster) (
                kanary_up{namespace="{{args.namespace}}", type=~"{{args.types}}", tested_cluster=~"{{args.clusters}}"}
              ) == 1
            )
