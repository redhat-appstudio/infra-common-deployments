---
# Kanary verification against staging Observatorium (RHOBS). Used by ring-1 which targets staging clusters.
#
# The monitoring duration is customizable per stage via the initial-delay, check-interval, check-count, and
# failure-limit args. Defaults: 40m delay + 48 checks × 30m = ~24h monitoring with 80% pass rate.
#
# Example Stage spec.verification:
#   analysisTemplates:
#     - name: kanary-staging
#   args:
#     - name: clusters
#       value: stone-stg-rh01|stone-stage-p01
#     - name: expected-cluster-count
#       value: "2"
#     - name: check-count           # optional: override for longer/shorter monitoring
#       value: "96"                  # 96 × 30m = ~48h
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: kanary-staging
spec:
  args:
    - name: clusters
    - name: expected-cluster-count
    - name: namespace
      value: konflux-otel
    - name: types
      value: container-single-arch
    - name: initial-delay
      value: "40m"
    - name: check-interval
      value: "30m"
    - name: check-count
      value: "48"
    - name: failure-limit
      value: "9"
    - name: prometheus-address
      value: https://observatorium-mst.api.stage.openshift.com/api/metrics/v1/rhtap
    - name: token-url
      value: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
    - name: oauth-client-id
      valueFrom:
        secretKeyRef:
          name: kargo-rhobs-staging
          key: client_id
    - name: oauth-client-secret
      valueFrom:
        secretKeyRef:
          name: kargo-rhobs-staging
          key: client_secret
  metrics:
    - name: kanary-up
      initialDelay: "{{args.initial-delay}}"
      interval: "{{args.check-interval}}"
      count: "{{args.check-count}}"
      failureLimit: "{{args.failure-limit}}"
      successCondition: len(result) > 0 && result[0] == {{args.expected-cluster-count}}
      provider:
        prometheus:
          address: "{{args.prometheus-address}}"
          timeout: 40
          authentication:
            oauth2:
              tokenUrl: "{{args.token-url}}"
              clientId: "{{args.oauth-client-id}}"
              clientSecret: "{{args.oauth-client-secret}}"
              scopes:
                - profile
          query: |
            count(
              min by (tested_cluster) (
                kanary_up{namespace="{{args.namespace}}", type=~"{{args.types}}", tested_cluster=~"{{args.clusters}}"}
              ) == 1
            )
    # - name: kanary-error
    #   initialDelay: 40m
    #   interval: 40m
    #   consecutiveSuccessLimit: 1
    #   failureLimit: 1
    #   successCondition: len(result) > 0 && result[0] == {{args.expected-cluster-count}}
