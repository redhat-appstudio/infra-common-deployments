---
# Opt-in workflow task; see README.md for contracts and limitations.
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: publish-promotion-pr
spec:
  vars:
    - name: srcPath
    - name: component
    - name: targetRing
    - name: prepared
    - name: baseCommitSHA
    - name: mergeMode
    - name: skipProwChecks
    # Optional presentation data; missing metadata must not change promotion policy.
    - name: prSummary
      value: ${{ '' }}
    - name: prChanges
      value: ${{ [] }}
    - name: prCompareURL
      value: ${{ '' }}
  steps:
    - uses: fail
      as: validate-config
      if: >-
        ${{ vars.prepared != 'yes' || vars.baseCommitSHA == '' || vars.mergeMode not in ['auto', 'manual'] || vars.skipProwChecks not in ['true',
        'false'] }}
      config:
        message: Component preparation must succeed; supply baseCommitSHA and explicit merge/Prow policies.
    - uses: git-commit
      as: commit
      if: ${{ status('validate-config') == 'Skipped' }}
      config:
        path: ${{ vars.srcPath }}
        message: 'chore(${{ ctx.stage }}): promote ${{ vars.component }} to ${{ vars.targetRing }}'
    # One branch per component/ring lets subsequent Promotions update the same PR.
    # Kargo serializes Promotions within a Stage; CI must use this push's SHA.
    - uses: git-push
      as: push
      if: ${{ status('commit') == 'Succeeded' }}
      config:
        path: ${{ vars.srcPath }}
        targetBranch: ${{ ctx.project }}/${{ vars.component }}/${{ vars.targetRing }}
        force: true
    - uses: git-open-pr
      as: open-pr
      if: ${{ status('push') == 'Succeeded' }}
      # Only the recovery path may turn an exhausted native error into success.
      continueOnError: true
      # Retry native discovery before spending requests on the PAT-backed fallback.
      retry:
        timeout: 5m
        errorThreshold: 3
      config:
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        sourceBranch: ${{ ctx.project }}/${{ vars.component }}/${{ vars.targetRing }}
        targetBranch: main
        title: 'chore(${{ ctx.stage }}): promote ${{ vars.component }} to ${{ vars.targetRing }}'
        description: |
          ## Promote ${{ vars.component }} to ${{ vars.targetRing }}

          ${{ vars.prSummary != '' ? vars.prSummary : 'Update the component to the selected Freight.' }}

          ${{ len(vars.prChanges) > 0 ? '| Change | Previous Git configuration | Proposed | File |\n|---|---|---|---|\n' + join(map(vars.prChanges, {'| ' + replace(replace(replace(replace(string(#.kind), '|', '&#124;'), '`', '&#96;'), '\n', ' '), '\r', ' ') + ' | `' + replace(replace(replace(replace(string(#.previous), '|', '&#124;'), '`', '&#96;'), '\n', ' '), '\r', ' ') + '` | `' + replace(replace(replace(replace(string(#.proposed), '|', '&#124;'), '`', '&#96;'), '\n', ' '), '\r', ' ') + '` | `' + replace(replace(replace(replace(string(#.path), '|', '&#124;'), '`', '&#96;'), '\n', ' '), '\r', ' ') + '` |'}), '\n') : '' }}

          ${{ vars.prCompareURL != '' ? '[Compare configured manifest refs](' + vars.prCompareURL + ')' : '' }}

          ${{ vars.mergeMode == 'auto' ? 'Merges automatically after required checks pass.' : 'Requires manual merge after required checks pass.' }}${{ vars.skipProwChecks == 'true' ? '' : ' Prow is required.' }}

          <details>
          <summary>Promotion details</summary>

          | Field | Value |
          |---|---|
          | Project | `${{ ctx.project }}` |
          | Freight | `${{ ctx.targetFreight.alias }}` (`${{ ctx.targetFreight.name }}`) |
          | Promotion | `${{ ctx.promotion }}` |
          | Published commit | `${{ task.outputs['push'].commit }}` |

          </details>

          ${{ len(vars.prChanges) > 0 ? 'Previous values reflect Git configuration, not necessarily the running deployment.' : '' }}
        labels:
          - ${{ vars.targetRing }}
          - automated-promotion
          - component/${{ vars.component }}
    # Recovery only: adopt an existing PR after native discovery exhausts retries.
    - uses: http
      as: find-pr
      if: ${{ status('push') == 'Succeeded' && status('open-pr') in ['Errored', 'Failed'] }}
      retry:
        timeout: 5m
      config:
        method: GET
        url: https://api.github.com/repos/redhat-appstudio/infra-deployments/pulls?state=open&base=main&head=redhat-appstudio:${{ ctx.project }}/${{ vars.component }}/${{ vars.targetRing }}&per_page=2
        headers: &github-headers
          - name: Authorization
            value: Bearer ${{ sharedSecret('konflux-kargo-git-operations').github_pat }}
          - name: Accept
            value: application/vnd.github+json
        pollInterval: 2m
        timeout: 30s
        successExpression: |
          response.status == 200 &&
          len(response.body) == 1 && response.body[0].state == 'open' &&
          response.body[0].head.repo.full_name == 'redhat-appstudio/infra-deployments' &&
          response.body[0].base.repo.full_name == 'redhat-appstudio/infra-deployments' &&
          response.body[0].head.ref == ${{ quote(ctx.project + '/' + vars.component + '/' + vars.targetRing) }} &&
          response.body[0].base.ref == 'main' && response.body[0].head.sha == ${{ quote(task.outputs['push'].commit) }}
        failureExpression: |
          response.status in [401, 404] ||
          (response.status == 403 && response.header('X-RateLimit-Remaining') != '0' && response.header('Retry-After') == '' && !(lower(response.body?.message ?? '') contains 'rate limit')) ||
          (response.status == 200 && len(response.body) > 1)
        errorExpression: "'Cannot resolve the promotion PR: HTTP ' + string(response.status) + '; require one open PR with the expected repository, branch, base and pushed SHA'"
        outputs:
          - name: prNumber
            fromExpression: response.body[0].number
          - name: prURL
            fromExpression: response.body[0].html_url
    # continueOnError must never hide a publication failure without proven recovery.
    - uses: fail
      as: require-published-pr
      if: ${{ status('push') == 'Succeeded' && status('open-pr') in ['Errored', 'Failed'] && status('find-pr') != 'Succeeded' }}
      config:
        message: Native PR publication failed and no matching open PR could be recovered. CI and merge remain blocked.
    # A skipped PR can mean main already has the promoted tree. Verify, never assume.
    - uses: http
      as: read-converged-main
      if: ${{ status('push') == 'Succeeded' && status('open-pr') == 'Skipped' }}
      retry:
        timeout: 2h
      config:
        method: GET
        url: https://api.github.com/repos/redhat-appstudio/infra-deployments/commits/main
        headers: *github-headers
        pollInterval: 2m
        timeout: 30s
        successExpression: response.status == 200 && (response.body.sha ?? '') != '' && (response.body.commit.tree.sha ?? '') != ''
        failureExpression: response.status in [401, 404] || (response.status == 403 && response.header('X-RateLimit-Remaining') != '0' && response.header('Retry-After')
          == '' && !(lower(response.body?.message ?? '') contains 'rate limit'))
        errorExpression: '''Cannot confirm concurrent no-op: HTTP '' + string(response.status) + ''; main must have the exact promoted Git tree'''
        outputs:
          - name: commitSHA
            fromExpression: response.body.sha
          - name: treeSHA
            fromExpression: response.body.commit.tree.sha
    - uses: http
      as: verify-converged-tree
      if: ${{ status('read-converged-main') == 'Succeeded' }}
      retry:
        timeout: 2h
      config:
        method: GET
        url: https://api.github.com/repos/redhat-appstudio/infra-deployments/commits/${{ task.outputs['push'].commit }}
        headers: *github-headers
        pollInterval: 2m
        timeout: 30s
        successExpression: response.status == 200 && response.body.commit.tree.sha == ${{ quote(task.outputs['read-converged-main'].treeSHA) }}
        failureExpression: (response.status in [401, 404] || (response.status == 403 && response.header('X-RateLimit-Remaining') != '0' && response.header('Retry-After')
          == '' && !(lower(response.body?.message ?? '') contains 'rate limit'))) || (response.status == 200 && response.body.commit.tree.sha
          != ${{ quote(task.outputs['read-converged-main'].treeSHA) }})
        errorExpression: '''Cannot confirm concurrent no-op: HTTP '' + string(response.status) + ''; main must have the exact promoted Git tree'''
    # Successful publication includes verified no-ops; readiness must still run.
    - uses: compose-output
      as: result
      if: >-
        ${{ status('validate-config') == 'Skipped' && (status('commit') == 'Skipped' ||
        (status('find-pr') == 'Succeeded' && task.outputs['find-pr'].prNumber > 0) ||
        status('open-pr') == 'Succeeded' || status('verify-converged-tree') == 'Succeeded') }}
      config:
        published: 'yes'
        promotionAsNoOp: '${{ (status(''commit'') == ''Skipped'' || status(''verify-converged-tree'') == ''Succeeded'') ? ''yes'' : ''no'' }}'
        baseCommitSHA: '${{ status(''verify-converged-tree'') == ''Succeeded'' ? task.outputs[''read-converged-main''].commitSHA : vars.baseCommitSHA
          }}'
        headCommitSHA: '${{ (status(''commit'') == ''Skipped'' || status(''verify-converged-tree'') == ''Succeeded'') ? '''' : task.outputs[''push''].commit
          }}'
        prNumber: >-
          ${{ (task.outputs['find-pr']?.prNumber ?? 0) > 0 ? task.outputs['find-pr'].prNumber : (task.outputs['open-pr']?.pr?.id ?? 0) }}
        prURL: >-
          ${{ (task.outputs['find-pr']?.prNumber ?? 0) > 0 ? task.outputs['find-pr'].prURL : (task.outputs['open-pr']?.pr?.url ?? '') }}
