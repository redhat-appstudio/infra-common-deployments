          - konflux-admins
          - cluster-admins
          - dedicated-admins
          - konflux-infra
          - konflux-devprod
      viewers:
        claims:
          groups:
          - system:authenticated:oauth
      dex:
        enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        image:
