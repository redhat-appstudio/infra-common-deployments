---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kyverno-source-credentials
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  data:
    - secretKey: githubAppID
      remoteRef:
        key: production/devprod/konflux-redhat-appstudio-bot
        property: githubAppID
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: production/devprod/konflux-redhat-appstudio-bot
        property: githubAppPrivateKey
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: appsre-stonesoup-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    name: kyverno-source-credentials
    template:
      engineVersion: v2
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
        annotations:
          kargo.akuity.io/github-token-scopes: |
            {"kargo-konflux-infrastructure": ["kyverno"]}
      data:
        githubAppID: "{{ .githubAppID }}"
        githubAppPrivateKey: "{{ .githubAppPrivateKey }}"
        # konflux-ci installation; deployment PRs use redhat-appstudio.
        githubAppInstallationID: "168199985"
        repoURL: https://github.com/konflux-ci/kyverno.git
