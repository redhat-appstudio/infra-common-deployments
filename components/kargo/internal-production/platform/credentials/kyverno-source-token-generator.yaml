---
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: kyverno-source-token
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  appID: "3794764"
  # konflux-ci installation; the deployment PR credential uses redhat-appstudio.
  installID: "168199985"
  repositories:
    - kyverno
  permissions:
    contents: read
  auth:
    privateKey:
      secretRef:
        name: kargo-promotion-credentials
        key: githubAppPrivateKey
