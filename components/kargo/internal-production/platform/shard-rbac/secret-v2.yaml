---
# v2 token for the kargo-shard-staging ServiceAccount (KFLUXDP-1367
# rotation). Its token is uploaded as a new version of the existing
# staging/devprod/kargo-shard-kubeconfig Vault key; the shard
# ExternalSecrets keep that key unchanged. kargo-shard-staging-token
# stays valid until a cleanup PR removes it, after every shard runs on
# the v2 kubeconfig.
apiVersion: v1
kind: Secret
metadata:
  name: kargo-shard-staging-token-v2
  namespace: kargo
  annotations:
    kubernetes.io/service-account.name: kargo-shard-staging
type: kubernetes.io/service-account-token
