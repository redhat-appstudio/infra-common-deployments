---
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote-kyverno-images-ring-3
spec:
  vars:
    - name: srcPath
    - name: component
    - name: targetRing
      value: ring-3
    - name: upstreamImageRepoURL
      value: reg.kyverno.io/kyverno
    - name: kfluxImageRepoBaseURL
      value: quay.io/konflux-ci/kyverno
    - name: kfluxKyvernoImageRepoURL
      value: quay.io/konflux-ci/kyverno/kyverno

  steps:
    # Validate the freight
    - uses: fail
      as: validate-freight
      if: >-
        ${{ ctx.targetFreight.origin.name != 'kyverno' || vars.component != ctx.targetFreight.origin.name ||
        !(commitFrom(vars.kfluxKyvernoImageRepoURL).ID matches '^[0-9a-f]{40}$') }}
      config:
        message: Expected a kyverno Freight with SHA-tagged kyverno image.
    # Wait for the other images to be available
    # -- Kyverno Init image
    - uses: http
      as: wait-for-kyverno-init-image
      if: ${{ status('validate-freight') == 'Skipped' }}
      retry:
        timeout: 2h
        errorThreshold: 5
      config:
        method: GET
        url: >-
          https://quay.io/api/v1/repository/konflux-ci/kyverno/kyverno-init/tag/?specificTag=${{ imageFrom(vars.kfluxKyvernoImageRepoURL).Tag
          }}&onlyActiveTags=true&limit=1
        headers:
          - name: Accept
            value: application/json
        pollInterval: 2m
        timeout: 30s
        successExpression: >-
          response.status == 200 && len(response.body.tags ?? []) == 1 && response.body.tags[0].name == ${{ quote(imageFrom(vars.kfluxKyvernoImageRepoURL).Tag)
          }} && (response.body.tags[0].manifest_digest ?? '') matches '^sha256:[0-9a-f]{64}$'
        failureExpression: response.status in [400, 401, 403, 404]
        errorExpression: >-
          'Cannot verify matching kyverno-init image ${{ imageFrom(vars.kfluxKyvernoImageRepoURL).Tag }} in quay.io/konflux-ci/kyverno/kyverno-init:
          HTTP ' + string(response.status)
    # -- Kyverno Background image
    - uses: http
      as: wait-for-kyverno-background-image
      if: ${{ status('validate-freight') == 'Skipped' }}
      retry:
        timeout: 2h
        errorThreshold: 5
      config:
        method: GET
        url: >-
          https://quay.io/api/v1/repository/konflux-ci/kyverno/kyverno-background/tag/?specificTag=${{ imageFrom(vars.kfluxKyvernoImageRepoURL).Tag
          }}&onlyActiveTags=true&limit=1
        headers:
          - name: Accept
            value: application/json
        pollInterval: 2m
        timeout: 30s
        successExpression: >-
          response.status == 200 && len(response.body.tags ?? []) == 1 && response.body.tags[0].name == ${{ quote(imageFrom(vars.kfluxKyvernoImageRepoURL).Tag)
          }} && (response.body.tags[0].manifest_digest ?? '') matches '^sha256:[0-9a-f]{64}$'
        failureExpression: response.status in [400, 401, 403, 404]
        errorExpression: >-
          'Cannot verify matching kyverno-background image ${{ imageFrom(vars.kfluxKyvernoImageRepoURL).Tag }} in quay.io/konflux-ci/kyverno/kyverno-background:
          HTTP ' + string(response.status)
    # -- Kyverno CLI image
    - uses: http
      as: wait-for-kyverno-cli-image
      if: ${{ status('validate-freight') == 'Skipped' }}
      retry:
        timeout: 2h
        errorThreshold: 5
      config:
        method: GET
        url: >-
          https://quay.io/api/v1/repository/konflux-ci/kyverno/kyverno-cli/tag/?specificTag=${{ imageFrom(vars.kfluxKyvernoImageRepoURL).Tag
          }}&onlyActiveTags=true&limit=1
        headers:
          - name: Accept
            value: application/json
        pollInterval: 2m
        timeout: 30s
        successExpression: >-
          response.status == 200 && len(response.body.tags ?? []) == 1 && response.body.tags[0].name == ${{ quote(imageFrom(vars.kfluxKyvernoImageRepoURL).Tag)
          }} && (response.body.tags[0].manifest_digest ?? '') matches '^sha256:[0-9a-f]{64}$'
        failureExpression: response.status in [400, 401, 403, 404]
        errorExpression: >-
          'Cannot verify matching kyverno-cli image ${{ imageFrom(vars.kfluxKyvernoImageRepoURL).Tag }} in quay.io/konflux-ci/kyverno/kyverno-cli:
          HTTP ' + string(response.status)
    # -- Kyverno Cleanup image
    - uses: http
      as: wait-for-kyverno-cleanup-image
      if: ${{ status('validate-freight') == 'Skipped' }}
      retry:
        timeout: 2h
        errorThreshold: 5
      config:
        method: GET
        url: >-
          https://quay.io/api/v1/repository/konflux-ci/kyverno/kyverno-cleanup/tag/?specificTag=${{ imageFrom(vars.kfluxKyvernoImageRepoURL).Tag
          }}&onlyActiveTags=true&limit=1
        headers:
          - name: Accept
            value: application/json
        pollInterval: 2m
        timeout: 30s
        successExpression: >-
          response.status == 200 && len(response.body.tags ?? []) == 1 && response.body.tags[0].name == ${{ quote(imageFrom(vars.kfluxKyvernoImageRepoURL).Tag)
          }} && (response.body.tags[0].manifest_digest ?? '') matches '^sha256:[0-9a-f]{64}$'
        failureExpression: response.status in [400, 401, 403, 404]
        errorExpression: >-
          'Cannot verify matching kyverno-cleanup image ${{ imageFrom(vars.kfluxKyvernoImageRepoURL).Tag }} in quay.io/konflux-ci/kyverno/kyverno-cleanup:
          HTTP ' + string(response.status)

    # Get previous images for PR summary info
    # -- stone-prd-rh01
    - uses: yaml-parse
      as: read-previous-images-prd-rh01
      if: >-
        ${{ status('wait-for-kyverno-init-image') == 'Succeeded' && status('wait-for-kyverno-background-image') == 'Succeeded' &&
        status('wait-for-kyverno-cli-image') == 'Succeeded' && status('wait-for-kyverno-cleanup-image') == 'Succeeded' }}
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/stone-prd-rh01/kustomization.yaml
        outputs:
          - name: kyvernoImagePrdRH01
            fromExpression: filter(images ?? [], {.name == 'vars.upstreamImageRepoURL' + '/kyverno'})
          - name: kyvernopreImagePrdRH01
            fromExpression: filter(images ?? [], {.name == 'vars.upstreamImageRepoURL' + '/kyvernopre'})
          - name: backgroundControllerImagePrdRH01
            fromExpression: filter(images ?? [], {.name == 'vars.upstreamImageRepoURL' + '/background-controller'})
          - name: cleanupControllerImagePrdRH01
            fromExpression: filter(images ?? [], {.name == 'vars.upstreamImageRepoURL' + '/cleanup-controller'})
          - name: kyvernoCliImagePrdRH01
            fromExpression: filter(images ?? [], {.name == 'vars.upstreamImageRepoURL' + '/kyverno-cli'})
    - uses: fail
      as: validate-layout-prd-rh01
      if: >-
        ${{ status('read-previous-images-prd-rh01') == 'Succeeded' && (len(task.outputs['read-previous-images-prd-rh01'].kyvernoImagePrdRH01) != 1
        || len(task.outputs['read-previous-images-prd-rh01'].kyvernopreImagePrdRH01) != 1
        || len(task.outputs['read-previous-images-prd-rh01'].backgroundControllerImagePrdRH01) != 1
        || len(task.outputs['read-previous-images-prd-rh01'].cleanupControllerImagePrdRH01) != 1
        || len(task.outputs['read-previous-images-prd-rh01'].kyvernoCliImagePrdRH01) != 1) }}
      config:
        message: "Expected the following five Kyverno images: kyverno, kyvernopre, background-controller, cleanup-controller,
          kyverno-cli in the stone-prd-rh01 Kustomization."
    # -- stone-prod-p02
    - uses: yaml-parse
      as: read-previous-images-prd-p02
      if: >-
        ${{ status('wait-for-kyverno-init-image') == 'Succeeded' && status('wait-for-kyverno-background-image') == 'Succeeded' &&
        status('wait-for-kyverno-cli-image') == 'Succeeded' && status('wait-for-kyverno-cleanup-image') == 'Succeeded' }}
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/stone-prod-p02/kustomization.yaml
        outputs:
          - name: kyvernoImagePrdP02
            fromExpression: filter(images ?? [], {.name == 'vars.upstreamImageRepoURL' + '/kyverno'})
          - name: kyvernopreImagePrdP02
            fromExpression: filter(images ?? [], {.name == 'vars.upstreamImageRepoURL' + '/kyvernopre'})
          - name: backgroundControllerImagePrdP02
            fromExpression: filter(images ?? [], {.name == 'vars.upstreamImageRepoURL' + '/background-controller'})
          - name: cleanupControllerImagePrdP02
            fromExpression: filter(images ?? [], {.name == 'vars.upstreamImageRepoURL' + '/cleanup-controller'})
          - name: kyvernoCliImagePrdP02
            fromExpression: filter(images ?? [], {.name == 'vars.upstreamImageRepoURL' + '/kyverno-cli'})
    - uses: fail
      as: validate-layout-prd-p02
      if: >-
        ${{ status('read-previous-images-prd-p02') == 'Succeeded' && (len(task.outputs['read-previous-images-prd-p02'].kyvernoImagePrdP02) != 1
        || len(task.outputs['read-previous-images-prd-p02'].kyvernopreImagePrdP02) != 1
        || len(task.outputs['read-previous-images-prd-p02'].backgroundControllerImagePrdP02) != 1
        || len(task.outputs['read-previous-images-prd-p02'].cleanupControllerImagePrdP02) != 1
        || len(task.outputs['read-previous-images-prd-p02'].kyvernoCliImagePrdP02) != 1) }}
      config:
        message: "Expected the following five Kyverno images: kyverno, kyvernopre, background-controller, cleanup-controller,
          kyverno-cli in the stone-prod-p02 Kustomization."

    # Update all images
    # -- stone-prd-rh01
    - uses: kustomize-set-image
      as: update-images-prd-rh01
      if: ${{ status('read-previous-images-prd-rh01') == 'Succeeded' && status('validate-layout-prd-rh01') == 'Skipped' }}
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/stone-prd-rh01
        images:
          - image: ${{ vars.upstreamImageRepoURL }}/kyverno
            newName: ${{ vars.kfluxImageRepoBaseURL }}/kyverno
            tag: ${{ imageFrom(vars.kfluxKyvernoImageRepoURL).Tag }}
          - image: ${{ vars.upstreamImageRepoURL }}/kyvernopre
            newName: ${{ vars.kfluxImageRepoBaseURL }}/kyverno-init
            tag: ${{ imageFrom(vars.kfluxKyvernoImageRepoURL).Tag }}
          - image: ${{ vars.upstreamImageRepoURL }}/background-controller
            newName: ${{ vars.kfluxImageRepoBaseURL }}/kyverno-background
            tag: ${{ imageFrom(vars.kfluxKyvernoImageRepoURL).Tag }}
          - image: ${{ vars.upstreamImageRepoURL }}/cleanup-controller
            newName: ${{ vars.kfluxImageRepoBaseURL }}/kyverno-cleanup
            tag: ${{ imageFrom(vars.kfluxKyvernoImageRepoURL).Tag }}
          - image: ${{ vars.upstreamImageRepoURL }}/kyverno-cli
            newName: ${{ vars.kfluxImageRepoBaseURL }}/kyverno-cli
            tag: ${{ imageFrom(vars.kfluxKyvernoImageRepoURL).Tag }}
    # -- stone-prod-p02
    - uses: kustomize-set-image
      as: update-images-prd-p02
      if: ${{ status('read-previous-images-prd-p02') == 'Succeeded' && status('validate-layout-prd-p02') == 'Skipped' }}
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/stone-prod-p02
        images:
          - image: ${{ vars.upstreamImageRepoURL }}/kyverno
            newName: ${{ vars.kfluxImageRepoBaseURL }}/kyverno
            tag: ${{ imageFrom(vars.kfluxKyvernoImageRepoURL).Tag }}
          - image: ${{ vars.upstreamImageRepoURL }}/kyvernopre
            newName: ${{ vars.kfluxImageRepoBaseURL }}/kyverno-init
            tag: ${{ imageFrom(vars.kfluxKyvernoImageRepoURL).Tag }}
          - image: ${{ vars.upstreamImageRepoURL }}/background-controller
            newName: ${{ vars.kfluxImageRepoBaseURL }}/kyverno-background
            tag: ${{ imageFrom(vars.kfluxKyvernoImageRepoURL).Tag }}
          - image: ${{ vars.upstreamImageRepoURL }}/cleanup-controller
            newName: ${{ vars.kfluxImageRepoBaseURL }}/kyverno-cleanup
            tag: ${{ imageFrom(vars.kfluxKyvernoImageRepoURL).Tag }}
          - image: ${{ vars.upstreamImageRepoURL }}/kyverno-cli
            newName: ${{ vars.kfluxImageRepoBaseURL }}/kyverno-cli
            tag: ${{ imageFrom(vars.kfluxKyvernoImageRepoURL).Tag }}

    # Outputs information for the PR summary
    - uses: compose-output
      as: result
      if: >-
        ${{ status('read-previous-images-prd-rh01') == 'Succeeded' && status('validate-layout-prd-rh01') == 'Succeeded'
        && status('update-images-prd-rh01') == 'Succeeded' && status('read-previous-images-prd-p02') == 'Succeeded'
        && status('validate-layout-prd-p02') == 'Succeeded' && status('update-images-prd-p02') == 'Succeeded' }}
      config:
        prepared: 'yes'
        prSummary: |
          Update the Kyverno images to the same source reference in ${{ vars.targetRing }}.

        prChanges:
          # -- stone-prd-rh01
          - kind: Kyverno image (prd-rh01)
            previous: >-
              ${{ quote(string(task.outputs['read-previous-images-prd-rh01'].kyvernoImagePrdRH01[0].digest ??
              task.outputs['read-previous-images-prd-rh01'].kyvernoImagePrdRH01[0].newTag ?? 'not configured')) }}
            proposed: ${{ quote(imageFrom(vars.kfluxKyvernoImageRepoURL).Tag) }}
            path: components/${{ vars.component }}/rings/${{ vars.targetRing }}/stone-prd-rh01/kustomization.yaml
          - kind: Kyverno-init image (prd-rh01)
            previous: >-
              ${{ quote(string(task.outputs['read-previous-images-prd-rh01'].kyvernopreImagePrdRH01[0].digest ??
              task.outputs['read-previous-images-prd-rh01'].kyvernopreImagePrdRH01[0].newTag ?? 'not configured')) }}
            proposed: ${{ quote(imageFrom(vars.kfluxKyvernoImageRepoURL).Tag) }}
            path: components/${{ vars.component }}/rings/${{ vars.targetRing }}/stone-prd-rh01/kustomization.yaml
          - kind: Background-controller image (prd-rh01)
            previous: >-
              ${{ quote(string(task.outputs['read-previous-images-prd-rh01'].backgroundControllerImagePrdRH01[0].digest ??
              task.outputs['read-previous-images-prd-rh01'].backgroundControllerImagePrdRH01[0].newTag ?? 'not configured')) }}
            proposed: ${{ quote(imageFrom(vars.kfluxKyvernoImageRepoURL).Tag) }}
            path: components/${{ vars.component }}/rings/${{ vars.targetRing }}/stone-prd-rh01/kustomization.yaml
          - kind: Cleanup-controller image (prd-rh01)
            previous: >-
              ${{ quote(string(task.outputs['read-previous-images-prd-rh01'].cleanupControllerImagePrdRH01[0].digest ??
              task.outputs['read-previous-images-prd-rh01'].cleanupControllerImagePrdRH01[0].newTag ?? 'not configured')) }}
            proposed: ${{ quote(imageFrom(vars.kfluxKyvernoImageRepoURL).Tag) }}
            path: components/${{ vars.component }}/rings/${{ vars.targetRing }}/stone-prd-rh01/kustomization.yaml
          # -- stone-prod-p02
          - kind: Kyverno image (prd-p02)
            previous: >-
              ${{ quote(string(task.outputs['read-previous-images-prd-p02'].kyvernoImagePrdP02[0].digest ??
              task.outputs['read-previous-images-prd-p02'].kyvernoImagePrdP02[0].newTag ?? 'not configured')) }}
            proposed: ${{ quote(imageFrom(vars.kfluxKyvernoImageRepoURL).Tag) }}
            path: components/${{ vars.component }}/rings/${{ vars.targetRing }}/stone-prod-p02/kustomization.yaml
          - kind: Kyverno-init image (prd-p02)
            previous: >-
              ${{ quote(string(task.outputs['read-previous-images-prd-p02'].kyvernopreImagePrdP02[0].digest ??
              task.outputs['read-previous-images-prd-p02'].kyvernopreImagePrdP02[0].newTag ?? 'not configured')) }}
            proposed: ${{ quote(imageFrom(vars.kfluxKyvernoImageRepoURL).Tag) }}
            path: components/${{ vars.component }}/rings/${{ vars.targetRing }}/stone-prod-p02/kustomization.yaml
          - kind: Background-controller image (prd-p02)
            previous: >-
              ${{ quote(string(task.outputs['read-previous-images-prd-p02'].backgroundControllerImagePrdP02[0].digest ??
              task.outputs['read-previous-images-prd-p02'].backgroundControllerImagePrdP02[0].newTag ?? 'not configured')) }}
            proposed: ${{ quote(imageFrom(vars.kfluxKyvernoImageRepoURL).Tag) }}
            path: components/${{ vars.component }}/rings/${{ vars.targetRing }}/stone-prod-p02/kustomization.yaml
          - kind: Cleanup-controller image (prd-p02)
            previous: >-
              ${{ quote(string(task.outputs['read-previous-images-prd-p02'].cleanupControllerImagePrdP02[0].digest ??
              task.outputs['read-previous-images-prd-p02'].cleanupControllerImagePrdP02[0].newTag ?? 'not configured')) }}
            proposed: ${{ quote(imageFrom(vars.kfluxKyvernoImageRepoURL).Tag) }}
            path: components/${{ vars.component }}/rings/${{ vars.targetRing }}/stone-prod-p02/kustomization.yaml
