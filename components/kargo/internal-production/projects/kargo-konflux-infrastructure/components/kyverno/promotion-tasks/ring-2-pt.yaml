          - name: kyvernopreImageOspP01
            fromExpression: filter(images ?? [], {.name == 'vars.upstreamImageRepoURL' + '/kyvernopre'})
          - name: backgroundControllerImageOspP01
            fromExpression: filter(images ?? [], {.name == 'vars.upstreamImageRepoURL' + '/background-controller'})
          - name: cleanupControllerImageOspP01
            fromExpression: filter(images ?? [], {.name == 'vars.upstreamImageRepoURL' + '/cleanup-controller'})
          - name: kyvernoCliImageOspP01
            fromExpression: filter(images ?? [], {.name == 'vars.upstreamImageRepoURL' + '/kyverno-cli'})
    - uses: fail
      as: validate-layout-osp-p01
      if: >-
        ${{ status('read-previous-images-osp-p01') == 'Succeeded' && (len(task.outputs['read-previous-images-osp-p01'].kyvernoImageOspP01) != 1
        || len(task.outputs['read-previous-images-osp-p01'].kyvernopreImageOspP01) != 1
        || len(task.outputs['read-previous-images-osp-p01'].backgroundControllerImageOspP01) != 1
        || len(task.outputs['read-previous-images-osp-p01'].cleanupControllerImageOspP01) != 1
        || len(task.outputs['read-previous-images-osp-p01'].kyvernoCliImageOspP01) != 1) }}
      config:
        message: "Expected the following five Kyverno images: kyverno, kyvernopre, background-controller, cleanup-controller,
          kyverno-cli in the kflux-osp-p01 Kustomization."
    # -- kflux-prd-rh03
    - uses: yaml-parse
      as: read-previous-images-prd-rh03
      if: >-
        ${{ status('wait-for-kyverno-init-image') == 'Succeeded' && status('wait-for-kyverno-background-image') == 'Succeeded' &&
        status('wait-for-kyverno-cli-image') == 'Succeeded' && status('wait-for-kyverno-cleanup-image') == 'Succeeded' }}
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/kflux-prd-rh03/kustomization.yaml
        outputs:
          - name: kyvernoImagePrdRH03
            fromExpression: filter(images ?? [], {.name == 'vars.upstreamImageRepoURL' + '/kyverno'})
          - name: kyvernopreImagePrdRH03
            fromExpression: filter(images ?? [], {.name == 'vars.upstreamImageRepoURL' + '/kyvernopre'})
          - name: backgroundControllerImagePrdRH03
            fromExpression: filter(images ?? [], {.name == 'vars.upstreamImageRepoURL' + '/background-controller'})
          - name: cleanupControllerImagePrdRH03
            fromExpression: filter(images ?? [], {.name == 'vars.upstreamImageRepoURL' + '/cleanup-controller'})
          - name: kyvernoCliImagePrdRH03
            fromExpression: filter(images ?? [], {.name == 'vars.upstreamImageRepoURL' + '/kyverno-cli'})
    - uses: fail
      as: validate-layout-prd-rh03
      if: >-
        ${{ status('read-previous-images-prd-rh03') == 'Succeeded' && (len(task.outputs['read-previous-images-prd-rh03'].kyvernoImagePrdRH03) != 1
        || len(task.outputs['read-previous-images-prd-rh03'].kyvernopreImagePrdRH03) != 1
        || len(task.outputs['read-previous-images-prd-rh03'].backgroundControllerImagePrdRH03) != 1
        || len(task.outputs['read-previous-images-prd-rh03'].cleanupControllerImagePrdRH03) != 1
        || len(task.outputs['read-previous-images-prd-rh03'].kyvernoCliImagePrdRH03) != 1) }}
