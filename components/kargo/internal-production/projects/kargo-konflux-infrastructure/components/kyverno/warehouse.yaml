---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: kyverno
spec:
  freightCreationPolicy: Automatic
  interval: 2h0m0s
  subscriptions:
    - image:
        repoURL: quay.io/konflux-ci/kyverno/kyverno
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 5
        allowTagsRegexes:
          - ^[0-9a-f]{40}$
  # The selected image's pinned upstream source determines its chart and app
  # versions. The PromotionTask verifies this exact pair is published in the
  # Helm repository before any cluster manifests are changed.
  freightCreationCriteria:
    expression: |
      imageFrom('quay.io/konflux-ci/kyverno/kyverno') != nil &&
      (imageFrom('quay.io/konflux-ci/kyverno/kyverno').Tag matches '^[0-9a-f]{40}$')
