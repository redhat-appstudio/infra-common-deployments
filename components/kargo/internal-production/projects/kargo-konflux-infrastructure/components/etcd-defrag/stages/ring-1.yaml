---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: ring-1-etcd-defrag
  labels:
    konflux-environment: staging
  annotations:
    kargo.akuity.io/color: yellow
spec:
  shard: infra-deployments-staging
  requestedFreight:
    - origin:
        kind: Warehouse
        name: etcd-defrag-manifest-wh
      sources:
        stages:
          - ring-0-etcd-defrag
    - origin:
        kind: Warehouse
        name: etcd-defrag-image-wh
      sources:
        stages:
          - ring-0-etcd-defrag
  verification:
    analysisTemplates:
      - name: kanary-staging
    args:
      - name: clusters
        value: stone-stg-rh01|stone-stage-p01
      - name: expected-cluster-count
        value: "2"
  promotionTemplate:
    spec:
      vars:
        - name: srcPath
          value: ./src
        - name: repoURL
          value: https://github.com/redhat-appstudio/infra-deployments.git
        - name: component
          value: etcd-defrag-rd
        - name: targetRing
          value: ring-1
        # ring-0 is a compose-output passthrough (no manifest snapshot),
        # so ring-1 copies directly from the component base.
        - name: prevRing
          value: base
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.repoURL }}
            checkout:
              - branch: main
                path: ${{ vars.srcPath }}
        - task:
            name: promote-etcd-defrag-manifests
          as: promote-etcd-defrag
          vars:
            - name: srcPath
              value: ${{ vars.srcPath }}
            - name: component
              value: ${{ vars.component }}
            - name: prevRing
              value: ${{ vars.prevRing }}
            - name: targetRing
              value: ${{ vars.targetRing }}
        - uses: git-commit
          as: commit
          config:
            path: ${{ vars.srcPath }}
            message: |
              chore(${{ ctx.stage }}): promote ${{ vars.component }} to ${{ vars.targetRing }}
        - uses: git-push
          as: push
          config:
            path: ${{ vars.srcPath }}
            targetBranch: ${{ ctx.project }}/${{ vars.component }}/${{ vars.targetRing }}
            force: true
        - uses: git-open-pr
          as: open-pr
          continueOnError: true
          config:
            repoURL: ${{ vars.repoURL }}
            sourceBranch: ${{ ctx.project }}/${{ vars.component }}/${{ vars.targetRing }}
            targetBranch: main
            title: "chore(${{ ctx.stage }}): promote ${{ vars.component }} to ${{ vars.targetRing }}"
            description: |
              ### ${{ ctx.stage }}

              | | |
              |---|---|
              | **Component** | `${{ vars.component }}` |
              | **Project** | `${{ ctx.project }}` |
              | **Promotion** | `${{ ctx.promotion }}` |
              | **Freight** | `${{ ctx.targetFreight.alias }}` |

              ---

              Auto-merged after CI passes. No manual approval required for Ring 1.

              > Branch is force-pushed each promotion cycle. Do not commit directly.
            labels:
              - ring-1
              - automated-promotion
              - component/${{ vars.component }}
        - task:
            name: github-ci-gate
          as: github-ci-gate
          vars:
            - name: commitSHA
              value: ${{ outputs['push'].commit }}
            - name: skipProwChecks
              value: "true"
        - uses: http
          as: find-pr
          retry:
            timeout: 5m0s
            errorThreshold: 10
          config:
            method: GET
            url: https://api.github.com/repos/redhat-appstudio/infra-deployments/pulls?head=redhat-appstudio:${{ ctx.project }}/${{ vars.component }}/${{ vars.targetRing }}&state=open
            headers:
              - name: Authorization
                value: Bearer ${{ sharedSecret('konflux-kargo-git-operations').github_pat }}
              - name: Accept
                value: application/vnd.github+json
            outputs:
              - name: prNumber
                fromExpression: response.body[0].number
            successExpression: response.status == 200 && len(response.body) > 0
            timeout: 30s
        - uses: git-merge-pr
          as: merge-pr
          retry:
            timeout: 2h0m0s
          config:
            repoURL: ${{ vars.repoURL }}
            prNumber: ${{ outputs['find-pr'].prNumber }}
            mergeMethod: squash
            wait: true
        - task:
            name: wait-for-infra-deployments-argocd-sync
          as: wait-for-sync
          vars:
            - name: commitSHA
              value: ${{ outputs['merge-pr'].commit }}
            - name: component
              value: ${{ vars.component }}
            - name: clusters
              value: "stone-stg-rh01|stone-stage-p01"
            - name: tokenSecret
              value: argocd-app-reader-token-staging
