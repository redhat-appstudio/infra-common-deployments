---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: etcd-defrag-manifest-wh
spec:
  freightCreationPolicy: Automatic
  interval: 2h0m0s
  subscriptions:
    - git:
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        commitSelectionStrategy: NewestFromBranch
        branch: main
        includePaths:
          - 'configs/etcd-defrag-rd/base'
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: etcd-defrag-image-wh
spec:
  freightCreationPolicy: Automatic
  interval: 2h0m0s
  subscriptions:
    - image:
        repoURL: quay.io/konflux-ci/etcd-defrag
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 5
        allowTagsRegexes:
          - ^[0-9a-f]{64}$
