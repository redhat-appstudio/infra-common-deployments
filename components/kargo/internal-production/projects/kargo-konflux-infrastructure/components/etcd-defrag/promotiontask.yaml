---
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: prepare-etcd-defrag
spec:
  vars:
    - name: srcPath
    - name: freightPath
    - name: repoURL
    - name: component
    - name: targetRing
    - name: imageRepoURL
      value: quay.io/konflux-ci/etcd-defrag
    - name: componentPath
      value: configs/etcd-defrag

  steps:
    - uses: fail
      as: validate-freight
      if: >-
        ${{ ctx.targetFreight.origin.name != 'etcd-defrag' || vars.component != ctx.targetFreight.origin.name
        || vars.targetRing not in ['ring-1', 'ring-2', 'ring-3', 'ring-4']
        || !(commitFrom(vars.repoURL).ID matches '^[0-9a-f]{40}$')
        || !(imageFrom(vars.imageRepoURL).Tag matches '^[0-9a-f]{64}$') }}
      config:
        message: Expected etcd-defrag Freight with a Git commit and a digest-tagged image, targeting rings 1-4.

    - uses: delete
      as: delete-old-base-snapshot
      if: ${{ status('validate-freight') == 'Skipped' }}
      config:
        path: ${{ vars.srcPath }}/${{ vars.componentPath }}/rings/${{ vars.targetRing }}/base/base-snapshot

    - uses: copy
      as: copy-freight-manifests
      if: ${{ status('delete-old-base-snapshot') == 'Succeeded' }}
      config:
        inPath: ${{ vars.freightPath }}/${{ vars.componentPath }}/base
        outPath: ${{ vars.srcPath }}/${{ vars.componentPath }}/rings/${{ vars.targetRing }}/base/base-snapshot

    - uses: yaml-update
      as: update-image
      if: ${{ status('copy-freight-manifests') == 'Succeeded' }}
      config:
        path: ${{ vars.srcPath }}/${{ vars.componentPath }}/rings/${{ vars.targetRing }}/base/image-patch.yaml
        updates:
          - key: "1.value"
            value: ${{ vars.imageRepoURL }}@sha256:${{ imageFrom(vars.imageRepoURL).Tag }}

    - uses: compose-output
      as: result
      if: >-
        ${{ status('validate-freight') == 'Skipped'
        && status('delete-old-base-snapshot') == 'Succeeded' && status('copy-freight-manifests') == 'Succeeded'
        && status('update-image') == 'Succeeded' }}
      config:
        prepared: 'yes'
        prSummary: >-
          Update etcd-defrag image and base snapshot in ${{ vars.targetRing }}.
        prChanges:
          - kind: Image value
            proposed: ${{ quote(vars.imageRepoURL + '@sha256:' + imageFrom(vars.imageRepoURL).Tag) }}
            path: ${{ vars.componentPath }}/rings/${{ vars.targetRing }}/base/image-patch.yaml
