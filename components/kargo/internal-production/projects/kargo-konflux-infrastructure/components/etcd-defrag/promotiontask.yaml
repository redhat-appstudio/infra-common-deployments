apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote-etcd-defrag-manifests
spec:
  vars:
    - name: srcPath
    - name: component
    - name: prevRing
    - name: targetRing
    - name: imageRepoURL
      value: quay.io/konflux-ci/etcd-defrag

  steps:
    - uses: kustomize-set-image
      as: update-image
      if: ${{ ctx.targetFreight.origin.name == "etcd-defrag-image-wh" }}
      config:
        path: ${{ vars.srcPath }}/configs/${{ vars.component }}/rings/${{ vars.targetRing }}/base
        images:
          - image: ${{ vars.imageRepoURL }}
            tag: ${{ imageFrom(vars.imageRepoURL).Tag }}

    - uses: delete
      as: delete-old-base-snapshot-folder
      if: ${{ ctx.targetFreight.origin.name == "etcd-defrag-manifest-wh" }}
      config:
        path: ${{ vars.srcPath }}/configs/${{ vars.component }}/rings/${{ vars.targetRing }}/base/base-snapshot

    - uses: copy
      as: copy-tier-1-folder
      if: ${{ ctx.targetFreight.origin.name == "etcd-defrag-manifest-wh" && vars.prevRing == "base" }}
      config:
        inPath: ${{ vars.srcPath }}/configs/${{ vars.component }}/base
        outPath: ${{ vars.srcPath }}/configs/${{ vars.component }}/rings/${{ vars.targetRing }}/base/base-snapshot

    - uses: copy
      as: copy-prev-ring-base-snapshot-folder
      if: ${{ ctx.targetFreight.origin.name == "etcd-defrag-manifest-wh" && vars.prevRing != "base" }}
      config:
        inPath: ${{ vars.srcPath }}/configs/${{ vars.component }}/rings/${{ vars.prevRing }}/base/base-snapshot
        outPath: ${{ vars.srcPath }}/configs/${{ vars.component }}/rings/${{ vars.targetRing }}/base/base-snapshot
