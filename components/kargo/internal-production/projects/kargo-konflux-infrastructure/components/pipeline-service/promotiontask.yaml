---
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote-pipeline-service-manifests
spec:
  vars:
    - name: srcPath
    - name: freightPath
    - name: repoURL
    - name: component
    - name: targetRing

  steps:
    - uses: fail
      as: validate-freight
      if: >-
        ${{ ctx.targetFreight.origin.name != 'pipeline-service' || vars.component != ctx.targetFreight.origin.name
        || vars.targetRing not in ['ring-0', 'ring-1', 'ring-2', 'ring-3', 'ring-4']
        || !(commitFrom(vars.repoURL).ID matches '^[0-9a-f]{40}$') }}
      config:
        message: Expected pipeline-service Freight containing a Git commit, targeting Ring 0-4.

    - uses: delete
      as: delete-old-base-snapshot
      if: ${{ status('validate-freight') == 'Skipped' }}
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/base-snapshot

    - uses: copy
      as: copy-freight-manifests
      if: ${{ status('delete-old-base-snapshot') == 'Succeeded' }}
      config:
        inPath: ${{ vars.freightPath }}/components/${{ vars.component }}/base
        outPath: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/base-snapshot

    - uses: compose-output
      as: result
      if: >-
        ${{ status('validate-freight') == 'Skipped' && status('delete-old-base-snapshot') == 'Succeeded' && status('copy-freight-manifests') == 'Succeeded' }}
      config:
        prepared: 'yes'
        prSummary: |
          Update pipeline-service base manifests in ${{ vars.targetRing }} from the selected Git revision.

          Source: [${{ commitFrom(vars.repoURL).ID[0:12] }}](https://github.com/redhat-appstudio/infra-deployments/commit/${{ commitFrom(vars.repoURL).ID }}).

          Replaces `components/pipeline-service/rings/${{ vars.targetRing }}/base/base-snapshot`. Ring-specific overlays are preserved.
