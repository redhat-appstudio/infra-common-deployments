---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: ring-2-cert-manager-trusted-ca
  labels:
    konflux-environment: production
  annotations:
    kargo.akuity.io/color: orange
spec:
  shard: infra-deployments-production
  requestedFreight:
    - origin:
        kind: Warehouse
        name: cert-manager-trusted-ca
      sources:
        stages:
          - ring-1-cert-manager-trusted-ca
  promotionTemplate:
    spec:
      vars:
        - name: srcPath
          value: ./src
        - name: repoURL
          value: https://github.com/redhat-appstudio/infra-deployments.git
        - name: component
          value: ${{ ctx.targetFreight.origin.name }}
        - name: targetRing
          value: ring-2
        - name: mergeMode
          value: auto
        - name: skipProwChecks
          value: 'true'
        - name: freightPath
          value: ./freight
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.repoURL }}
            checkout:
              - branch: main
                path: ${{ vars.srcPath }}
              - commit: ${{ commitFrom(vars.repoURL).ID }}
                path: ${{ vars.freightPath }}

        - task:
            name: promote-cert-manager-trusted-ca-manifests
          as: promote
          vars:
            - name: srcPath
              value: ${{ vars.srcPath }}
            - name: freightPath
              value: ${{ vars.freightPath }}
            - name: repoURL
              value: ${{ vars.repoURL }}
            - name: component
              value: ${{ vars.component }}
            - name: targetRing
              value: ${{ vars.targetRing }}

        - task:
            name: publish-promotion-pr
          as: publish
          vars:
            - name: srcPath
              value: ${{ vars.srcPath }}
            - name: component
              value: ${{ vars.component }}
            - name: targetRing
              value: ${{ vars.targetRing }}
            - name: prSummary
              value: ${{ outputs['promote::result']?.prSummary ?? '' }}
            - name: prChanges
              value: ${{ outputs['promote::result']?.prChanges ?? [] }}
            - name: prCompareURL
              value: ${{ outputs['promote::result']?.prCompareURL ?? '' }}
            - name: prepared
              value: ${{ outputs['promote::result']?.prepared ?? '' }}
            - name: baseCommitSHA
              value: ${{ outputs['clone'].commits[vars.srcPath] }}
            - name: mergeMode
              value: ${{ vars.mergeMode }}
            - name: skipProwChecks
              value: ${{ quote(vars.skipProwChecks) }}

        - uses: set-metadata
          as: annotate-freight-as-no-op
          if: ${{ outputs['publish::result']?.published == 'yes' }}
          config:
            updates:
              - kind: Freight
                name: ${{ ctx.targetFreight.name }}
                values:
                  noOpRing2: ${{ outputs['publish::result'].promotionAsNoOp }}

        - task:
            name: verify-promotion-ci
          as: ci
          vars:
            - name: published
              value: ${{ outputs['publish::result']?.published ?? '' }}
            - name: commitSHA
              value: ${{ outputs['publish::result']?.headCommitSHA ?? '' }}
            - name: promotionAsNoOp
              value: ${{ outputs['publish::result']?.promotionAsNoOp ?? '' }}
            - name: skipProwChecks
              value: ${{ quote(vars.skipProwChecks) }}

        # The Kargo GitHub App can bypass branch rules; require approval explicitly.
        - uses: http
          as: wait-for-pr-approval
          if: ${{ outputs['ci::result']?.passed == 'yes' && outputs['publish::result']?.promotionAsNoOp == 'no' }}
          retry:
            timeout: 168h
          config:
            method: POST
            url: https://api.github.com/graphql
            timeout: 30s
            pollInterval: 2m
            headers:
              - name: Authorization
                value: Bearer ${{ repoCredentials('https://github.com/redhat-appstudio/infra-deployments.git', 'git').Password }}
              - name: Content-Type
                value: application/json
            body: |
              {"query":"query($number: Int!) { repository(owner: \"redhat-appstudio\", name: \"infra-deployments\") { pullRequest(number: $number) { state isDraft headRefOid reviewDecision } } }","variables":{"number":${{ outputs['publish::result'].prNumber }}}}
            successExpression: |
              response.status == 200 && len(response.body.errors ?? []) == 0 &&
              response.body.data?.repository?.pullRequest != nil &&
              response.body.data.repository.pullRequest.headRefOid == ${{ quote(outputs['publish::result'].headCommitSHA) }} &&
              (response.body.data.repository.pullRequest.state == 'MERGED' ||
                (response.body.data.repository.pullRequest.state == 'OPEN' &&
                 response.body.data.repository.pullRequest.isDraft == false &&
                 response.body.data.repository.pullRequest.reviewDecision == 'APPROVED'))
            failureExpression: |
              response.status in [401, 403, 404] ||
              (response.status == 200 && (len(response.body.errors ?? []) > 0 ||
                response.body.data?.repository?.pullRequest == nil ||
                response.body.data.repository.pullRequest.headRefOid != ${{ quote(outputs['publish::result'].headCommitSHA) }} ||
                response.body.data.repository.pullRequest.state == 'CLOSED'))
            errorExpression: "'Cannot verify PR approval: API error, missing/closed PR, or changed head SHA.'"

        - task:
            name: merge-promotion-pr
          as: merge
          vars:
            - name: passed
              value: ${{ outputs['ci::result']?.passed ?? '' }}
            - name: checkedSHA
              value: ${{ outputs['ci::result']?.checkedSHA ?? '' }}
            - name: headCommitSHA
              value: ${{ outputs['publish::result']?.headCommitSHA ?? '' }}
            - name: baseCommitSHA
              value: ${{ outputs['publish::result']?.baseCommitSHA ?? '' }}
            - name: prNumber
              value: ${{ outputs['publish::result']?.prNumber ?? 0 }}
            - name: promotionAsNoOp
              value: ${{ outputs['publish::result']?.promotionAsNoOp ?? '' }}
            - name: mergeMode
              value: ${{ vars.mergeMode }}

        - task:
            name: verify-argocd-deployment
          as: verify-deployment
          vars:
            - name: mergeConfirmed
              value: ${{ outputs['merge::result']?.mergeConfirmed ?? '' }}
            - name: commitSHA
              value: ${{ outputs['merge::result']?.mergeCommitSHA ?? '' }}
            - name: component
              value: ${{ vars.component }}
            - name: clusters
              value: kflux-lw-p01
            - name: tokenSecret
              value: argocd-app-reader-token
