---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: ring-0-repository-validator
  labels:
    konflux-environment: development
  annotations:
    kargo.akuity.io/color: blue
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: repository-validator-manifest-wh
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: srcPath
          value: ./src
        - name: repoURL
          value: https://github.com/redhat-appstudio/infra-deployments.git
        - name: component
          value: repository-validator-rd
        - name: targetRing
          value: ring-0
        - name: prevRing
          value: base
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.repoURL }}
            checkout:
              - branch: main
                path: ${{ vars.srcPath }}
        - task:
            name: promote-repository-validator-manifests
          as: promote-repository-validator
          vars:
            - name: srcPath
              value: ${{ vars.srcPath }}
            - name: prevRing
              value: ${{ vars.prevRing }}
            - name: targetRing
              value: ${{ vars.targetRing }}
        - uses: git-commit
          as: commit
          config:
            path: ${{ vars.srcPath }}
            message: |
              chore(${{ ctx.stage }}): promote repository-validator to ${{ vars.targetRing }}
        - uses: set-metadata
          as: annotate-freight-as-no-op
          config:
            updates:
              - name: ${{ ctx.targetFreight.name }}
                kind: Freight
                values:
                  noOpRing0: "${{ status('commit') == 'Skipped' ? 'true' : 'false' }}"
        - uses: compose-output
          as: set-promotion-as-no-op
          config:
            promotionAsNoOp: "${{ status('commit') == 'Skipped' ? 'yes' : 'no' }}"
        - uses: git-push
          as: push
          if: ${{ outputs['set-promotion-as-no-op'].promotionAsNoOp != 'yes' }}
          config:
            path: ${{ vars.srcPath }}
            targetBranch: ${{ ctx.project }}/repository-validator/${{ vars.targetRing }}
            force: true
        - uses: git-open-pr
          as: open-pr
          continueOnError: true
          if: ${{ outputs['set-promotion-as-no-op'].promotionAsNoOp != 'yes' }}
          config:
            repoURL: ${{ vars.repoURL }}
            sourceBranch: ${{ ctx.project }}/repository-validator/${{ vars.targetRing }}
            targetBranch: main
            title: "chore(${{ ctx.stage }}): promote repository-validator to ${{ vars.targetRing }}"
            description: |
              ### ${{ ctx.stage }}

              | | |
              |---|---|
              | **Component** | `repository-validator` |
              | **Project** | `${{ ctx.project }}` |
              | **Promotion** | `${{ ctx.promotion }}` |
              | **Freight** | `${{ ctx.targetFreight.alias }}` |

              ---

              Auto-merged after CI passes. No manual approval required for Ring 0.

              > Branch is force-pushed each promotion cycle. Do not commit directly.
            labels:
              - ring-0
              - automated-promotion
              - component/repository-validator
        - task:
            name: github-ci-gate
          as: github-ci-gate
          vars:
            - name: commitSHA
              value: "${{ outputs['push']?.commit ?? '' }}"
            - name: promotionAsNoOp
              value: "${{ outputs['set-promotion-as-no-op'].promotionAsNoOp }}"
            - name: skipProwChecks
              value: "true"
        - uses: http
          as: find-pr
          if: ${{ outputs['set-promotion-as-no-op'].promotionAsNoOp != 'yes' }}
          retry:
            timeout: 5m0s
            errorThreshold: 10
          config:
            method: GET
            url: https://api.github.com/repos/redhat-appstudio/infra-deployments/pulls?head=redhat-appstudio:${{ ctx.project }}/repository-validator/${{ vars.targetRing }}&state=open
            headers:
              - name: Authorization
                value: Bearer ${{ sharedSecret('konflux-kargo-git-operations').github_pat }}
              - name: Accept
                value: application/vnd.github+json
            outputs:
              - name: prNumber
                fromExpression: response.body[0].number
            successExpression: response.status == 200 && len(response.body) > 0
            timeout: 30s
        - uses: git-merge-pr
          as: merge-pr
          if: ${{ outputs['set-promotion-as-no-op'].promotionAsNoOp != 'yes' }}
          retry:
            timeout: 2h0m0s
          config:
            repoURL: ${{ vars.repoURL }}
            prNumber: ${{ outputs['find-pr'].prNumber }}
            mergeMethod: squash
            wait: true
