apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote-kueue
spec:
  vars:
    - name: srcPath
    - name: freightPath
    - name: repoURL
    - name: component
    - name: targetRing
    - name: imageRepoURL
      value: quay.io/konflux-ci/tekton-kueue
    - name: externalRepoURL
      value: https://github.com/konflux-ci/tekton-kueue/config/default

  steps:
    - uses: fail
      as: validate-bundle
      if: >-
        ${{ ctx.targetFreight.origin.name != 'kueue' || vars.component != ctx.targetFreight.origin.name
        || vars.targetRing not in ['ring-0', 'ring-1', 'ring-2', 'ring-3', 'ring-4']
        || !(commitFrom(vars.repoURL).ID matches '^[0-9a-f]{40}$')
        || !(imageFrom(vars.imageRepoURL).Tag matches '^[0-9a-f]{40}$') }}
      config:
        message: Expected kueue Freight with a Git commit and a SHA-tagged image, targeting Ring 0-4.
    - uses: yaml-parse
      as: read-previous
      if: ${{ status('validate-bundle') == 'Skipped' }}
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/tekton-kueue/kustomization.yaml
        outputs:
          - name: resources
            fromExpression: resources ?? []
          - name: images
            fromExpression: filter(images ?? [], {.name == 'konflux-ci/tekton-kueue'})
    - uses: fail
      as: validate-layout
      if: >-
        ${{ status('read-previous') == 'Succeeded' && (len(task.outputs['read-previous'].images) != 1
        || len(filter(task.outputs['read-previous'].resources, {# startsWith(vars.externalRepoURL)})) != 1) }}
      config:
        message: Expected one tekton-kueue image and one external repo reference in the ring Kustomization.
    - uses: delete
      as: delete-old-base-snapshot
      if: ${{ status('read-previous') == 'Succeeded' && status('validate-layout') == 'Skipped' }}
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/base-snapshot
    - uses: copy
      as: copy-freight-manifests
      if: ${{ status('delete-old-base-snapshot') == 'Succeeded' }}
      config:
        inPath: ${{ vars.freightPath }}/components/${{ vars.component }}/base
        outPath: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/base-snapshot
    - uses: kustomize-set-image
      as: update-image
      if: ${{ status('copy-freight-manifests') == 'Succeeded' }}
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/tekton-kueue
        images:
          - image: "konflux-ci/tekton-kueue"
            newName: ${{ vars.imageRepoURL }}
            tag: ${{ imageFrom(vars.imageRepoURL).Tag }}
    - uses: yaml-parse
      as: get-external-repo-index
      if: ${{ status('update-image') == 'Succeeded' }}
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/tekton-kueue/kustomization.yaml
        outputs:
          - name: externalRepoIndex
            fromExpression: "string(findIndex(resources, # startsWith('${{ vars.externalRepoURL }}')))"
    - uses: fail
      as: external-repo-ref-not-found
      if: ${{ status('get-external-repo-index') == 'Succeeded' && !(task.outputs['get-external-repo-index'].externalRepoIndex matches "^[0-9]+$") }}
      config:
        message: "Could not find resource '${{ vars.externalRepoURL }}' in resources list"
    - uses: yaml-update
      as: update-external-repo-ref
      if: ${{ status('get-external-repo-index') == 'Succeeded' && task.outputs['get-external-repo-index'].externalRepoIndex matches "^[0-9]+$" }}
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/tekton-kueue/kustomization.yaml
        updates:
          - key: "resources.${{ task.outputs['get-external-repo-index'].externalRepoIndex }}"
            value: "${{ vars.externalRepoURL }}?ref=${{ imageFrom(vars.imageRepoURL).Tag }}"
    - uses: compose-output
      as: result
      if: >-
        ${{ status('validate-bundle') == 'Skipped' && status('read-previous') == 'Succeeded'
        && status('validate-layout') == 'Skipped' && status('copy-freight-manifests') == 'Succeeded'
        && status('update-image') == 'Succeeded' && status('update-external-repo-ref') == 'Succeeded' }}
      config:
        prepared: 'yes'
        prSummary: >-
          Update tekton-kueue image, manifest reference, and shared base snapshot in ${{ vars.targetRing }}.
        prChanges:
          - kind: Image tag
            previous: >-
              ${{ quote(string(task.outputs['read-previous'].images[0].newTag ?? 'unknown')) }}
            proposed: ${{ quote(imageFrom(vars.imageRepoURL).Tag) }}
            path: components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/tekton-kueue/kustomization.yaml
          - kind: Manifest ref
            previous: >-
              ${{ quote(find(task.outputs['read-previous'].resources, {# startsWith(vars.externalRepoURL)})) }}
            proposed: "${{ vars.externalRepoURL }}?ref=${{ imageFrom(vars.imageRepoURL).Tag }}"
            path: components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/tekton-kueue/kustomization.yaml
