apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote-kueue
spec:
  vars:
    - name: srcPath
    - name: baseDirSrcPath
    - name: component
    - name: targetRing
    - name: imageRepoURL
      value: quay.io/konflux-ci/tekton-kueue
    - name: externalRepoURL
      value: https://github.com/konflux-ci/tekton-kueue/config/default

  steps:
    # Updates Tekton Kueue image
    - uses: kustomize-set-image
      as: update-image
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/tekton-kueue
        images:
          - image: "konflux-ci/tekton-kueue"
            newName: ${{ vars.imageRepoURL }}
            tag: ${{ imageFrom(vars.imageRepoURL).Tag }}

    # Updates Tekton Kueue external repo reference
    - uses: yaml-parse
      as: get-external-repo-index
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/tekton-kueue/kustomization.yaml
        outputs:
        - name: externalRepoIndex
          fromExpression: "string(findIndex(resources, # startsWith('${{ vars.externalRepoURL }}')))"
    #-- Ensures the output of the get-external-repo-index task is a valid index (the external repo reference was found)
    - uses: fail
      as: external-repo-ref-not-found
      if: ${{ !(task.outputs['get-external-repo-index'].externalRepoIndex matches "^[0-9]+$") }}
      config:
        message: "Could not find resource '${{ vars.externalRepoURL }}' in resources list of ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/tekton-kueue/kustomization.yaml"
    - uses: yaml-update
      as: update-external-repo-ref
      if: ${{ task.outputs['get-external-repo-index'].externalRepoIndex matches "^[0-9]+$" }}
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/tekton-kueue/kustomization.yaml
        updates:
          - key: "resources.${{ task.outputs['get-external-repo-index'].externalRepoIndex }}"
            value: "${{ vars.externalRepoURL }}?ref=${{ imageFrom(vars.imageRepoURL).Tag }}"

    # Copies the tier 1 base directory at the freight's commit ID to the target ring's base-snapshot directory
    # -- Deletes the target ring's base-snapshot directory, if it exists, to eliminate any orphaned files deleted in the new base copy
    - uses: delete
      as: delete-old-base-snapshot-folder
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/base-snapshot
    - uses: copy
      as: copy-base-folder
      config:
        inPath: ${{ vars.baseDirSrcPath }}/components/${{ vars.component }}/base
        outPath: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/base-snapshot
