---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kargo-konflux-infrastructure

resources:
  - base
  - components/authentication
  - components/etcd-defrag
  - components/etcd-shield
  - components/external-secrets-operator
  - components/kueue
  - components/multi-platform-controller
  - components/repository-validator

components:
  - ../../kargo-shared-promotion-tasks
  - ../../kargo-shared-verifications

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
