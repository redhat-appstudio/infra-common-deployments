---
# E2E connection secrets required to run Konflux conformance tests from
# github.com/konflux-ci/konflux-ci. Syncs SA tokens per staging cluster
# from Vault. New clusters are picked up automatically when their Vault
# key matches the pattern.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: konflux-conformance-sa
spec:
  dataFrom:
    - find:
        path: production/devprod
        name:
          regexp: "^konflux-conformance-.*"
        conversionStrategy: Default
        decodingStrategy: None
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: appsre-stonesoup-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    name: konflux-conformance-sa
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: generic
