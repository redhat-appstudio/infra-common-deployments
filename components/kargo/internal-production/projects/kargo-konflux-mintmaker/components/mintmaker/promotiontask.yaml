---
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: prepare-mintmaker
spec:
  vars:
    - name: srcPath
    - name: freightPath
    - name: repoURL
    - name: component
    - name: targetRing
    - name: controllerImageRepoURL
      value: quay.io/konflux-ci/mintmaker
    - name: renovateImageRepoURL
      value: quay.io/konflux-ci/mintmaker-renovate-image
    - name: schedulerImageRepoURL
      value: quay.io/konflux-ci/mintmaker-schedule-calculator
    - name: cliImageRepoURL
      value: quay.io/openshift/origin-cli
  steps:
    - uses: fail
      as: validate-freight
      if: >-
        ${{ ctx.targetFreight.origin.name != 'mintmaker' || vars.component != 'mintmaker'
        || vars.repoURL != 'https://github.com/redhat-appstudio/infra-deployments.git'
        || vars.controllerImageRepoURL != 'quay.io/konflux-ci/mintmaker'
        || vars.renovateImageRepoURL != 'quay.io/konflux-ci/mintmaker-renovate-image'
        || vars.schedulerImageRepoURL != 'quay.io/konflux-ci/mintmaker-schedule-calculator'
        || vars.cliImageRepoURL != 'quay.io/openshift/origin-cli'
        || vars.targetRing not in ['ring-0', 'ring-1', 'ring-2', 'ring-3', 'ring-4']
        || commitFrom(vars.repoURL) == nil
        || imageFrom(vars.controllerImageRepoURL) == nil
        || imageFrom(vars.renovateImageRepoURL) == nil
        || imageFrom(vars.schedulerImageRepoURL) == nil
        || imageFrom(vars.cliImageRepoURL) == nil
        || !(commitFrom(vars.repoURL).ID matches '^[0-9a-f]{40}$')
        || !(imageFrom(vars.controllerImageRepoURL).Tag matches '^[0-9a-f]{40}$')
        || !(imageFrom(vars.renovateImageRepoURL).Tag matches '^[0-9a-f]{40}$')
        || !(imageFrom(vars.schedulerImageRepoURL).Tag matches '^[0-9a-f]{40}$')
        || !(imageFrom(vars.cliImageRepoURL).Tag matches '^4[.]21([.](0|[1-9][0-9]*))?$') }}
      config:
        message: Expected MintMaker Freight with an infra-deployments commit and three independently SHA-tagged MintMaker images and a stable origin-cli 4.21.x tag, targeting Rings 0-4.
    - uses: yaml-parse
      as: read-previous
      if: ${{ status('validate-freight') == 'Skipped' }}
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/kustomization.yaml
        outputs:
          - name: resources
            fromExpression: resources ?? []
          - name: configurations
            fromExpression: configurations ?? []
          - name: controllerImages
            fromExpression: filter(images ?? [], {.name == 'quay.io/konflux-ci/mintmaker'})
          - name: renovateImages
            fromExpression: filter(images ?? [], {.name == 'quay.io/konflux-ci/mintmaker-renovate-image'})
          - name: schedulerImages
            fromExpression: filter(images ?? [], {.name == 'quay.io/konflux-ci/mintmaker-schedule-calculator'})
          - name: cliImages
            fromExpression: filter(images ?? [], {.name == 'quay.io/openshift/origin-cli'})
    - uses: fail
      as: validate-layout
      if: >-
        ${{ status('read-previous') == 'Succeeded' && (
        len(filter(task.outputs['read-previous'].resources, {# == 'base-snapshot'})) != 1
        || len(filter(task.outputs['read-previous'].resources, {# startsWith 'https://github.com/konflux-ci/mintmaker/config/default?ref='})) != 1
        || len(filter(task.outputs['read-previous'].resources, {# startsWith 'https://github.com/konflux-ci/mintmaker/config/renovate?ref='})) != 1
        || 'kustomizeconfig.yaml' not in task.outputs['read-previous'].configurations
        || len(task.outputs['read-previous'].controllerImages) != 1
        || len(task.outputs['read-previous'].renovateImages) != 1
        || len(task.outputs['read-previous'].schedulerImages) != 1
        || len(task.outputs['read-previous'].cliImages) > 1
        || (len(task.outputs['read-previous'].cliImages) == 1
        && (task.outputs['read-previous'].cliImages[0].newName ?? vars.cliImageRepoURL) != vars.cliImageRepoURL)
        || (task.outputs['read-previous'].controllerImages[0].newName ?? vars.controllerImageRepoURL) != vars.controllerImageRepoURL
        || (task.outputs['read-previous'].renovateImages[0].newName ?? vars.renovateImageRepoURL) != vars.renovateImageRepoURL
        || (task.outputs['read-previous'].schedulerImages[0].newName ?? vars.schedulerImageRepoURL) != vars.schedulerImageRepoURL) }}
      config:
        message: Expected one base snapshot, two controller manifest refs, three MintMaker image entries, at most one origin-cli override and the Renovate annotation transformer configuration.
    - uses: yaml-parse
      as: read-image-transformers
      if: ${{ status('read-previous') == 'Succeeded' && status('validate-layout') == 'Skipped' }}
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/kustomizeconfig.yaml
        outputs:
          - name: paths
            fromExpression: map(filter(images ?? [], {.kind == 'Deployment'}), {.path})
    - uses: fail
      as: validate-image-transformers
      if: >-
        ${{ status('read-image-transformers') == 'Succeeded' && (
        'spec/template/metadata/annotations/mintmaker.appstudio.redhat.com\\/renovate-image' not in task.outputs['read-image-transformers'].paths
        || 'spec/template/metadata/annotations/mintmaker.konflux-ci.dev\\/renovate-image' not in task.outputs['read-image-transformers'].paths) }}
      config:
        message: Both MintMaker Renovate pod annotations must be configured as image transformer paths.
    # Copy only the shared subtree from immutable Freight, preserving every ring's overrides.
    - uses: delete
      as: delete-old-base-snapshot
      if: ${{ status('read-image-transformers') == 'Succeeded' && status('validate-image-transformers') == 'Skipped' }}
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/base-snapshot
    - uses: copy
      as: copy-freight-manifests
      if: ${{ status('delete-old-base-snapshot') == 'Succeeded' }}
      config:
        inPath: ${{ vars.freightPath }}/components/${{ vars.component }}/base
        outPath: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/base-snapshot
    # Keep explicit image names and release tags, including Renovate pod annotations.
    - uses: kustomize-set-image
      as: update-images
      if: ${{ status('copy-freight-manifests') == 'Succeeded' }}
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/base
        images:
          - image: ${{ vars.controllerImageRepoURL }}
            newName: ${{ vars.controllerImageRepoURL }}
            tag: ${{ imageFrom(vars.controllerImageRepoURL).Tag }}
          - image: ${{ vars.renovateImageRepoURL }}
            newName: ${{ vars.renovateImageRepoURL }}
            tag: ${{ imageFrom(vars.renovateImageRepoURL).Tag }}
          - image: ${{ vars.schedulerImageRepoURL }}
            newName: ${{ vars.schedulerImageRepoURL }}
            tag: ${{ imageFrom(vars.schedulerImageRepoURL).Tag }}
          - image: ${{ vars.cliImageRepoURL }}
            newName: ${{ vars.cliImageRepoURL }}
            tag: ${{ imageFrom(vars.cliImageRepoURL).Tag }}
    # These two tenant CronJobs are added above the base and need an overlay-level transformer.
    - uses: kustomize-set-image
      as: update-ring-3-cli
      if: ${{ status('update-images') == 'Succeeded' && vars.targetRing == 'ring-3' }}
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/ring-3/stone-prod-p02
        images:
          - image: ${{ vars.cliImageRepoURL }}
            newName: ${{ vars.cliImageRepoURL }}
            tag: ${{ imageFrom(vars.cliImageRepoURL).Tag }}
    # Controller source refs follow its own release SHA, never the independent Git/Renovate/scheduler SHA.
    - uses: yaml-update
      as: update-manifest-refs
      if: >-
        ${{ status('update-images') == 'Succeeded'
        && (vars.targetRing != 'ring-3' || status('update-ring-3-cli') == 'Succeeded') }}
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/kustomization.yaml
        updates:
          - key: >-
              resources.${{ findIndex(task.outputs['read-previous'].resources, {# startsWith 'https://github.com/konflux-ci/mintmaker/config/default?ref='}) }}
            value: https://github.com/konflux-ci/mintmaker/config/default?ref=${{ imageFrom(vars.controllerImageRepoURL).Tag }}
          - key: >-
              resources.${{ findIndex(task.outputs['read-previous'].resources, {# startsWith 'https://github.com/konflux-ci/mintmaker/config/renovate?ref='}) }}
            value: https://github.com/konflux-ci/mintmaker/config/renovate?ref=${{ imageFrom(vars.controllerImageRepoURL).Tag }}
    # Render after every image and manifest-ref update, outside the checkout published in the PR.
    # Remove stale output first so a missing resource cannot pass on a retry.
    - uses: delete
      as: clear-ring-3-render
      if: ${{ vars.targetRing == 'ring-3' && status('update-manifest-refs') == 'Succeeded' }}
      config:
        path: ./mintmaker-ring-3-verification
    - uses: kustomize-build
      as: render-ring-3-cli
      if: ${{ status('clear-ring-3-render') == 'Succeeded' }}
      config:
        path: ${{ vars.srcPath }}/components/${{ vars.component }}/rings/ring-3/stone-prod-p02
        outPath: ./mintmaker-ring-3-verification
        outputFormat: kargo
    - uses: yaml-parse
      as: read-ring-3-ansible-cli
      if: ${{ status('render-ring-3-cli') == 'Succeeded' }}
      config:
        path: ./mintmaker-ring-3-verification/mintmaker-cronjob-create-dependencyupdatecheck-ansible-tenant.yaml
        outputs:
          - name: valid
            fromExpression: >-
              let cli = filter(spec.jobTemplate.spec.template.spec.containers ?? [], {.name == 'origin-cli'});
              apiVersion == 'batch/v1' && kind == 'CronJob' && metadata.namespace == 'mintmaker'
              && metadata.name == 'create-dependencyupdatecheck-ansible-tenant'
              && len(cli) == 1 && cli[0].image == ${{ quote(vars.cliImageRepoURL + ':' + imageFrom(vars.cliImageRepoURL).Tag) }}
    - uses: yaml-parse
      as: read-ring-3-osci-cli
      if: ${{ status('read-ring-3-ansible-cli') == 'Succeeded' }}
      config:
        path: ./mintmaker-ring-3-verification/mintmaker-cronjob-create-dependencyupdatecheck-osci-rhel-containers.yaml
        outputs:
          - name: valid
            fromExpression: >-
              let cli = filter(spec.jobTemplate.spec.template.spec.containers ?? [], {.name == 'origin-cli'});
              apiVersion == 'batch/v1' && kind == 'CronJob' && metadata.namespace == 'mintmaker'
              && metadata.name == 'create-dependencyupdatecheck-osci-rhel-containers'
              && len(cli) == 1 && cli[0].image == ${{ quote(vars.cliImageRepoURL + ':' + imageFrom(vars.cliImageRepoURL).Tag) }}
    - uses: fail
      as: validate-ring-3-cli
      if: >-
        ${{ status('read-ring-3-ansible-cli') == 'Succeeded' && status('read-ring-3-osci-cli') == 'Succeeded'
        && (task.outputs['read-ring-3-ansible-cli'].valid != true || task.outputs['read-ring-3-osci-cli'].valid != true) }}
      config:
        message: Both stone-prod-p02 tenant CronJobs must render with exactly one origin-cli container using the selected CLI image tag.
    - uses: compose-output
      as: result
      if: >-
        ${{ status('validate-freight') == 'Skipped' && status('read-previous') == 'Succeeded'
        && status('validate-layout') == 'Skipped' && status('read-image-transformers') == 'Succeeded'
        && status('validate-image-transformers') == 'Skipped' && status('delete-old-base-snapshot') == 'Succeeded'
        && status('copy-freight-manifests') == 'Succeeded' && status('update-images') == 'Succeeded'
        && (vars.targetRing != 'ring-3' || status('update-ring-3-cli') == 'Succeeded')
        && status('update-manifest-refs') == 'Succeeded'
        && (vars.targetRing != 'ring-3' || (status('clear-ring-3-render') == 'Succeeded'
        && status('render-ring-3-cli') == 'Succeeded' && status('read-ring-3-ansible-cli') == 'Succeeded'
        && status('read-ring-3-osci-cli') == 'Succeeded' && status('validate-ring-3-cli') == 'Skipped'
        && task.outputs['read-ring-3-ansible-cli'].valid == true && task.outputs['read-ring-3-osci-cli'].valid == true)) }}
      config:
        prepared: 'yes'
        prSummary: |
          Update the controller, Renovate, schedule calculator and origin-cli to their selected release tags in ${{ vars.targetRing }}.
          Align both controller manifest refs to controller source revision ${{ imageFrom(vars.controllerImageRepoURL).Tag }}.

          ${{ vars.targetRing == 'ring-3' ? 'Also update the origin-cli override in rings/ring-3/stone-prod-p02 for its tenant CronJobs.' : '' }}

          Shared base source: [${{ commitFrom(vars.repoURL).ID[0:12] }}](https://github.com/redhat-appstudio/infra-deployments/commit/${{ commitFrom(vars.repoURL).ID }}).
        prChanges:
          - kind: Controller image
            previous: ${{ quote(string(task.outputs['read-previous'].controllerImages[0].digest ?? task.outputs['read-previous'].controllerImages[0].newTag ?? 'not configured')) }}
            proposed: ${{ quote(imageFrom(vars.controllerImageRepoURL).Tag) }}
            path: components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/kustomization.yaml
          - kind: Renovate image (both pod annotations)
            previous: ${{ quote(string(task.outputs['read-previous'].renovateImages[0].digest ?? task.outputs['read-previous'].renovateImages[0].newTag ?? 'not configured')) }}
            proposed: ${{ quote(imageFrom(vars.renovateImageRepoURL).Tag) }}
            path: components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/kustomization.yaml
          - kind: Schedule calculator image
            previous: ${{ quote(string(task.outputs['read-previous'].schedulerImages[0].digest ?? task.outputs['read-previous'].schedulerImages[0].newTag ?? 'not configured')) }}
            proposed: ${{ quote(imageFrom(vars.schedulerImageRepoURL).Tag) }}
            path: components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/kustomization.yaml
          - kind: OpenShift CLI image
            previous: >-
              ${{ len(task.outputs['read-previous'].cliImages) == 0 ? 'inherited from base snapshot'
              : quote(string(task.outputs['read-previous'].cliImages[0].digest ?? task.outputs['read-previous'].cliImages[0].newTag ?? 'not configured')) }}
            proposed: ${{ quote(imageFrom(vars.cliImageRepoURL).Tag) }}
            path: components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/kustomization.yaml
          - kind: Controller manifest ref
            previous: ${{ quote(split(find(task.outputs['read-previous'].resources, {# startsWith 'https://github.com/konflux-ci/mintmaker/config/default?ref='}), '?ref=')[1]) }}
            proposed: ${{ quote(imageFrom(vars.controllerImageRepoURL).Tag) }}
            path: components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/kustomization.yaml
          - kind: Renovate manifest ref
            previous: ${{ quote(split(find(task.outputs['read-previous'].resources, {# startsWith 'https://github.com/konflux-ci/mintmaker/config/renovate?ref='}), '?ref=')[1]) }}
            proposed: ${{ quote(imageFrom(vars.controllerImageRepoURL).Tag) }}
            path: components/${{ vars.component }}/rings/${{ vars.targetRing }}/base/kustomization.yaml
