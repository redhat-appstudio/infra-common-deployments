---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: mintmaker
spec:
  freightCreationPolicy: Automatic
  interval: 2h0m0s
  subscriptions:
    - git:
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        commitSelectionStrategy: NewestFromBranch
        branch: main
        includePaths:
          - components/mintmaker/base
    # These are independent release streams, not builds with a shared source SHA.
    # Use the public release repositories, excluding latest and artifact tags.
    - image:
        repoURL: quay.io/konflux-ci/mintmaker
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 5
        allowTagsRegexes:
          - '^[0-9a-f]{40}$'
    - image:
        repoURL: quay.io/konflux-ci/mintmaker-renovate-image
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 5
        allowTagsRegexes:
          - '^[0-9a-f]{40}$'
    - image:
        repoURL: quay.io/konflux-ci/mintmaker-schedule-calculator
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 5
        allowTagsRegexes:
          - '^[0-9a-f]{40}$'
    # Select stable three-part OpenShift 4.X.Y release tags.
    - image:
        repoURL: quay.io/openshift/origin-cli
        imageSelectionStrategy: SemVer
        semverConstraint: '>=4.0.0 <5.0.0'
        discoveryLimit: 5
        allowTagsRegexes:
          - '^4[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$'
