---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: ring-0-mintmaker
  labels:
    konflux-environment: development
  annotations:
    kargo.akuity.io/color: blue
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: mintmaker
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: srcPath
          value: ./src
        - name: repoURL
          value: https://github.com/redhat-appstudio/infra-deployments.git
        - name: component
          value: ${{ ctx.targetFreight.origin.name }}
        - name: targetRing
          value: ring-0
        - name: mergeMode
          value: auto
        - name: skipProwChecks
          value: 'false'
        - name: requiredProwChecks
          value: ^ci/prow/konflux-ring-deployments-conformance-tests$
        - name: freightPath
          value: ./freight
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.repoURL }}
            checkout:
              - branch: main
                path: ${{ vars.srcPath }}
              - commit: ${{ commitFrom(vars.repoURL).ID }}
                path: ${{ vars.freightPath }}
        - task:
            name: prepare-mintmaker
          as: promote
          vars:
            - name: srcPath
              value: ${{ vars.srcPath }}
            - name: freightPath
              value: ${{ vars.freightPath }}
            - name: repoURL
              value: ${{ vars.repoURL }}
            - name: component
              value: ${{ vars.component }}
            - name: targetRing
              value: ${{ vars.targetRing }}
        - task:
            name: github-commit-changelog
          as: controller-changelog
          vars:
            - name: repository
              value: konflux-ci/mintmaker
            - name: previousSHA
              value: ${{ quote(outputs['promote::result'].previousControllerSHA) }}
            - name: proposedSHA
              value: ${{ quote(imageFrom('quay.io/konflux-ci/mintmaker').Tag) }}
        - task:
            name: github-commit-changelog
          as: renovate-changelog
          vars:
            - name: repository
              value: konflux-ci/mintmaker-renovate-image
            - name: previousSHA
              value: ${{ quote(outputs['promote::result'].previousRenovateSHA) }}
            - name: proposedSHA
              value: ${{ quote(imageFrom('quay.io/konflux-ci/mintmaker-renovate-image').Tag) }}
        - task:
            name: github-commit-changelog
          as: scheduler-changelog
          vars:
            - name: repository
              value: konflux-ci/mintmaker-schedule-calculator
            - name: previousSHA
              value: ${{ quote(outputs['promote::result'].previousSchedulerSHA) }}
            - name: proposedSHA
              value: ${{ quote(imageFrom('quay.io/konflux-ci/mintmaker-schedule-calculator').Tag) }}
        - task:
            name: publish-promotion-pr
          as: publish
          vars:
            - name: srcPath
              value: ${{ vars.srcPath }}
            - name: component
              value: ${{ vars.component }}
            - name: targetRing
              value: ${{ vars.targetRing }}
            - name: prSummary
              value: ${{ outputs['promote::result']?.prSummary ?? '' }}
            - name: prChanges
              value: ${{ outputs['promote::result']?.prChanges ?? [] }}
            - name: prChangelog
              value: |
                ## Source commit changelog

                ### Controller — konflux-ci/mintmaker
                ${{ outputs['controller-changelog::result']?.markdown ?? 'Commit changelog unavailable.' }}

                ### Renovate — konflux-ci/mintmaker-renovate-image
                ${{ outputs['renovate-changelog::result']?.markdown ?? 'Commit changelog unavailable.' }}

                ### Schedule calculator — konflux-ci/mintmaker-schedule-calculator
                ${{ outputs['scheduler-changelog::result']?.markdown ?? 'Commit changelog unavailable.' }}

                Source ranges use the previous Git-configured image SHA tags and selected Freight tags; they do not prove image provenance or live deployment state.
                The origin-cli version and shared base snapshot are shown above; no source commit baseline is inferred for them.
            - name: prCompareURL
              value: ${{ outputs['promote::result']?.prCompareURL ?? '' }}
            - name: prepared
              value: ${{ outputs['promote::result']?.prepared ?? '' }}
            - name: baseCommitSHA
              value: ${{ outputs['clone'].commits[vars.srcPath] }}
            - name: mergeMode
              value: ${{ vars.mergeMode }}
            - name: skipProwChecks
              value: ${{ quote(vars.skipProwChecks) }}
        - uses: set-metadata
          as: annotate-freight-as-no-op
          if: ${{ outputs['publish::result']?.published == 'yes' }}
          config:
            updates:
              - kind: Freight
                name: ${{ ctx.targetFreight.name }}
                values:
                  noOpRing0: ${{ outputs['publish::result'].promotionAsNoOp }}
        - task:
            name: verify-promotion-ci
          as: ci
          vars:
            - name: published
              value: ${{ outputs['publish::result']?.published ?? '' }}
            - name: commitSHA
              value: ${{ outputs['publish::result']?.headCommitSHA ?? '' }}
            - name: promotionAsNoOp
              value: ${{ outputs['publish::result']?.promotionAsNoOp ?? '' }}
            - name: skipProwChecks
              value: ${{ quote(vars.skipProwChecks) }}
            - name: requiredProwChecks
              value: ${{ vars.requiredProwChecks }}
        - task:
            name: merge-promotion-pr
          as: merge
          vars:
            - name: passed
              value: ${{ outputs['ci::result']?.passed ?? '' }}
            - name: checkedSHA
              value: ${{ outputs['ci::result']?.checkedSHA ?? '' }}
            - name: headCommitSHA
              value: ${{ outputs['publish::result']?.headCommitSHA ?? '' }}
            - name: baseCommitSHA
              value: ${{ outputs['publish::result']?.baseCommitSHA ?? '' }}
            - name: prNumber
              value: ${{ outputs['publish::result']?.prNumber ?? 0 }}
            - name: promotionAsNoOp
              value: ${{ outputs['publish::result']?.promotionAsNoOp ?? '' }}
            - name: mergeMode
              value: ${{ vars.mergeMode }}
