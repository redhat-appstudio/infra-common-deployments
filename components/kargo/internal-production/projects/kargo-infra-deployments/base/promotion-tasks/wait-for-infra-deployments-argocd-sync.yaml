---
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: wait-for-infra-deployments-argocd-sync
spec:
  vars:
    - name: commitSHA
    - name: component
    - name: clusters
    - name: appsNamespace
      value: argocd-infra-deployments
    - name: tokenSecret

  steps:
    - uses: http
      as: wait-for-all-healthy
      retry:
        timeout: 15m0s
        errorThreshold: 3
      config:
        method: GET
        url: https://kubernetes.default.svc/apis/argoproj.io/v1alpha1/namespaces/${{ vars.appsNamespace }}/applications
        headers:
          - name: Authorization
            value: Bearer ${{ secret(vars.tokenSecret).token }}
        insecureSkipTLSVerify: true
        successExpression: |
          response.status == 200 &&
          len(filter(response.body.items, {.metadata.name matches '^${{ vars.component }}-(${{ vars.clusters }})$'})) > 0 &&
          all(
            filter(response.body.items, {.metadata.name matches '^${{ vars.component }}-(${{ vars.clusters }})$'}),
            {
              .status?.sync?.status == 'Synced' &&
              .status?.health?.status == 'Healthy' &&
              (
                .status?.sync?.revision == '${{ vars.commitSHA }}' ||
                any(.status?.history ?? [], {.revision == '${{ vars.commitSHA }}'})
              )
            }
          )
        failureExpression: |
          response.status in [401, 403] ||
          (response.status == 200 &&
          (filter(response.body.items, {.metadata.name matches '^${{ vars.component }}-(${{ vars.clusters }})$'}) == [] ||
          any(
            filter(response.body.items, {.metadata.name matches '^${{ vars.component }}-(${{ vars.clusters }})$'}),
            {
              .status?.health?.status == 'Degraded' ||
              .status?.operationState?.phase in ['Failed', 'Error']
            }
          )))
        outputs:
          - name: appDetails
            fromExpression: |
              map(
                filter(response.body.items, {.metadata.name matches '^${{ vars.component }}-(${{ vars.clusters }})$'}),
                {.metadata.name + ' | health=' + (.status?.health?.status ?? 'unknown') + ' | commit=' + (.status?.sync?.revision ?? 'unknown')}
              )
          - name: lastCommit
            fromExpression: |
              len(filter(response.body.items, {.metadata.name matches '^${{ vars.component }}-(${{ vars.clusters }})$'})) > 0 ?
                (filter(response.body.items, {.metadata.name matches '^${{ vars.component }}-(${{ vars.clusters }})$'})[0].status?.sync?.revision ?? 'unknown') :
                'unknown'

    - uses: compose-output
      as: output
      config:
        appDetails: ${{ task.outputs['wait-for-all-healthy'].appDetails }}
        lastCommit: ${{ task.outputs['wait-for-all-healthy'].lastCommit }}
