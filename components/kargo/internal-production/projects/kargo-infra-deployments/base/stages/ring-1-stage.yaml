---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: ring-1
  annotations:
    kargo.akuity.io/color: green
spec:
  shard: infra-deployments-staging
  requestedFreight:
    - origin:
        kind: Warehouse
        name: dummy-deployment
      sources:
        stages:
          - ring-0-dummy-deployment
    - origin:
        kind: Warehouse
        name: konflux-operator
      sources:
        stages:
          - ring-0-konflux-operator
    - origin:
        kind: Warehouse
        name: authentication-manifest-wh
      sources:
        direct: true
    - origin:
        kind: Warehouse
        name: etcd-shield-manifest-wh
      sources:
        stages:
          - ring-0-etcd-shield
    - origin:
        kind: Warehouse
        name: etcd-shield-image-wh
      sources:
        stages:
          - ring-0-etcd-shield
    - origin:
        kind: Warehouse
        name: artifact-registry-proxy-manifest-wh
      sources:
        stages:
          - ring-0-artifact-registry-proxy
    - origin:
        kind: Warehouse
        name: artifact-registry-proxy-chart-wh
      sources:
        stages:
          - ring-0-artifact-registry-proxy
    - origin:
        kind: Warehouse
        name: container-image-proxy-manifest-wh
      sources:
        stages:
          - ring-0-container-image-proxy
    - origin:
        kind: Warehouse
        name: container-image-proxy-chart-wh
      sources:
        stages:
          - ring-0-container-image-proxy
  verification:
    analysisTemplates:
      - name: verify-kanary-staging
    args:
      - name: clusters
        value: stone-stg-rh01|stone-stage-p01
      - name: expected-cluster-count
        value: "2"
  promotionTemplate:
    spec:
      vars:
        - name: srcPath
          value: ./src
        - name: repoURL
          value: https://github.com/redhat-appstudio/infra-deployments.git
        - name: component
          value: "${{ hasSuffix(ctx.targetFreight.origin.name, '-image-wh') ? trimSuffix(ctx.targetFreight.origin.name, '-image-wh') : (hasSuffix(ctx.targetFreight.origin.name, '-manifest-wh') ? trimSuffix(ctx.targetFreight.origin.name, '-manifest-wh') : (hasSuffix(ctx.targetFreight.origin.name, '-chart-wh') ? trimSuffix(ctx.targetFreight.origin.name, '-chart-wh') : ctx.targetFreight.origin.name)) }}"
        - name: targetRing
          value: ring-1
        - name: prevRing
          value: ring-0
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.repoURL }}
            checkout:
              - branch: main
                path: ${{ vars.srcPath }}
        - task:
            name: dummy-deployment-promote-ring-1
          as: promote-dummy-deployment
          vars:
            - name: srcPath
              value: ${{ vars.srcPath }}
        - task:
            name: konflux-operator-promote-ring-1
          as: promote-konflux-operator
          vars:
            - name: srcPath
              value: ${{ vars.srcPath }}
        - task:
            name: promote-authentication-manifests
          as: promote-authentication
          vars:
            - name: srcPath
              value: ${{ vars.srcPath }}
            - name: component
              value: ${{ vars.component }}
            - name: prevRing
              value: base # Authentication does not have a ring 0
            - name: targetRing
              value: ${{ vars.targetRing }}
        - task:
            name: promote-etcd-shield-manifests
          as: promote-etcd-shield
          vars:
            - name: srcPath
              value: ${{ vars.srcPath }}
            - name: component
              value: ${{ vars.component }}
            - name: prevRing
              value: ${{ vars.prevRing }}
            - name: targetRing
              value: ${{ vars.targetRing }}
        - task:
            name: promote-artifact-registry-proxy-manifests
          as: promote-artifact-registry-proxy
          vars:
            - name: srcPath
              value: ${{ vars.srcPath }}
            - name: component
              value: ${{ vars.component }}
            - name: prevRing
              value: ${{ vars.prevRing }}
            - name: targetRing
              value: ${{ vars.targetRing }}
        - task:
            name: promote-container-image-proxy-manifests
          as: promote-container-image-proxy
          vars:
            - name: srcPath
              value: ${{ vars.srcPath }}
            - name: component
              value: ${{ vars.component }}
            - name: prevRing
              value: ${{ vars.prevRing }}
            - name: targetRing
              value: ${{ vars.targetRing }}
        - uses: git-commit
          as: commit
          config:
            path: ${{ vars.srcPath }}
            message: |
              chore(${{ ctx.stage }}): promote ${{ vars.component }} to ${{ vars.targetRing }}
        - uses: git-push
          as: push
          config:
            path: ${{ vars.srcPath }}
            targetBranch: ${{ ctx.project }}/${{ vars.component }}/${{ vars.targetRing }}
            force: true
        - uses: git-open-pr
          as: open-pr
          continueOnError: true
          config:
            repoURL: ${{ vars.repoURL }}
            sourceBranch: ${{ ctx.project }}/${{ vars.component }}/${{ vars.targetRing }}
            targetBranch: main
            title: "chore(${{ ctx.stage }}): promote ${{ vars.component }} to ${{ vars.targetRing }}"
            description: |
              ### ${{ ctx.stage }}

              | | |
              |---|---|
              | **Component** | `${{ vars.component }}` |
              | **Project** | `${{ ctx.project }}` |
              | **Promotion** | `${{ ctx.promotion }}` |
              | **Freight** | `${{ ctx.targetFreight.alias }}` |

              ---

              ${{ (outputs['promote-' + vars.component + '.pr-meta']?.details) ?? ('Promotes `' + vars.component + '` to **' + ctx.stage + '**.') }}

              ---

              Auto-merged after CI passes. No manual approval required for Ring 1.

              > Branch is force-pushed each promotion cycle. Do not commit directly.
            labels:
              - ${{ vars.targetRing }}
              - automated-promotion
              - component/${{ vars.component }}
        - task:
            name: wait-for-ci
          as: wait-for-ci
          vars:
            - name: commitSHA
              value: ${{ outputs['push'].commit }}
            - name: skipProwChecks
              value: "true"
        - uses: http
          as: find-pr
          retry:
            timeout: 5m0s
            errorThreshold: 10
          config:
            method: GET
            url: https://api.github.com/repos/redhat-appstudio/infra-deployments/pulls?head=redhat-appstudio:${{ ctx.project }}/${{ vars.component }}/${{ vars.targetRing }}&state=open
            headers:
              - name: Authorization
                value: Bearer ${{ secret('kargo-infra-deployments-secrets').github_pat }}
              - name: Accept
                value: application/vnd.github+json
            outputs:
              - name: prNumber
                fromExpression: response.body[0].number
            successExpression: response.status == 200 && len(response.body) > 0
            timeout: 30s
        - uses: git-merge-pr
          as: merge-pr
          retry:
            timeout: 2h0m0s
          config:
            repoURL: ${{ vars.repoURL }}
            prNumber: ${{ outputs['find-pr'].prNumber }}
            mergeMethod: squash
            wait: true
