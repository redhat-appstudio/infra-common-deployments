---
# Kanary verification against staging Observatorium (RHOBS).
# Used by ring-1 which targets staging clusters.
#
# Example Stage spec.verification:
#   analysisTemplates:
#     - name: verify-kanary-staging
#   args:
#     - name: clusters
#       value: stone-stg-rh01|stone-stage-p01
#     - name: expected-cluster-count
#       value: "2"
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: verify-kanary-staging
spec:
  args:
    - name: clusters
    - name: expected-cluster-count
    - name: namespace
      value: konflux-otel
    - name: types
      value: container-single-arch
    - name: prometheus-address
      value: https://observatorium-mst.api.stage.openshift.com/api/metrics/v1/rhtap
    - name: token-url
      value: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
    - name: oauth-client-id
      valueFrom:
        secretKeyRef:
          name: kargo-rhobs-staging
          key: client_id
    - name: oauth-client-secret
      valueFrom:
        secretKeyRef:
          name: kargo-rhobs-staging
          key: client_secret
  metrics:
    - name: kanary-up
      initialDelay: 40m
      interval: 40m
      consecutiveSuccessLimit: 1
      failureLimit: 1
      successCondition: len(result) > 0 && result[0] == {{args.expected-cluster-count}}
      provider:
        prometheus:
          address: "{{args.prometheus-address}}"
          timeout: 40
          authentication:
            oauth2:
              tokenUrl: "{{args.token-url}}"
              clientId: "{{args.oauth-client-id}}"
              clientSecret: "{{args.oauth-client-secret}}"
              scopes:
                - profile
          query: |
            count(
              min by (tested_cluster) (
                kanary_up{namespace="{{args.namespace}}", type=~"{{args.types}}", tested_cluster=~"{{args.clusters}}"}
              ) == 1
            )
    - name: kanary-error
      initialDelay: 40m
      interval: 40m
      consecutiveSuccessLimit: 1
      failureLimit: 1
      successCondition: len(result) > 0 && result[0] == {{args.expected-cluster-count}}
      provider:
        prometheus:
          address: "{{args.prometheus-address}}"
          timeout: 40
          authentication:
            oauth2:
              tokenUrl: "{{args.token-url}}"
              clientId: "{{args.oauth-client-id}}"
              clientSecret: "{{args.oauth-client-secret}}"
              scopes:
                - profile
          query: |
            count(
              max by (tested_cluster) (
                kanary_error{namespace="{{args.namespace}}", type=~"{{args.types}}", tested_cluster=~"{{args.clusters}}"}
              ) == 0
            )
