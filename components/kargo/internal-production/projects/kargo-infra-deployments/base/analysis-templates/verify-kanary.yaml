---
# Reusable kanary verification against production Observatorium (RHOBS).
# Stages pass clusters as a PromQL regex and expected-cluster-count.
#
# Example Stage spec.verification:
#   analysisTemplates:
#     - name: verify-kanary
#   args:
#     - name: clusters
#       value: kflux-ocp-p01|kflux-prd-rh02
#     - name: expected-cluster-count
#       value: "2"
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: verify-kanary
spec:
  args:
    - name: clusters
    - name: expected-cluster-count
    - name: namespace
      value: appstudio-kanary-exporter
    - name: types
      value: ".*"
    - name: prometheus-address
      value: https://observatorium-mst.api.openshift.com/api/metrics/v1/rhtap
    - name: token-url
      value: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
    - name: oauth-client-id
      valueFrom:
        secretKeyRef:
          name: kargo-rhobs-production
          key: client_id
    - name: oauth-client-secret
      valueFrom:
        secretKeyRef:
          name: kargo-rhobs-production
          key: client_secret
  metrics:
    - name: kanary-up
      initialDelay: 30m
      interval: 30m
      consecutiveSuccessLimit: 1
      failureLimit: 1
      successCondition: result[0] == {{args.expected-cluster-count}}
      provider:
        prometheus:
          address: "{{args.prometheus-address}}"
          timeout: 40
          authentication:
            oauth2:
              tokenUrl: "{{args.token-url}}"
              clientId: "{{args.oauth-client-id}}"
              clientSecret: "{{args.oauth-client-secret}}"
          query: |
            count(
              min by (tested_cluster) (
                kanary_up{namespace="{{args.namespace}}", type=~"{{args.types}}", tested_cluster=~"{{args.clusters}}"}
              ) == 1
            )
    - name: kanary-error
      initialDelay: 30m
      interval: 30m
      consecutiveSuccessLimit: 1
      failureLimit: 1
      successCondition: result[0] == {{args.expected-cluster-count}}
      provider:
        prometheus:
          address: "{{args.prometheus-address}}"
          timeout: 40
          authentication:
            oauth2:
              tokenUrl: "{{args.token-url}}"
              clientId: "{{args.oauth-client-id}}"
              clientSecret: "{{args.oauth-client-secret}}"
          query: |
            count(
              max by (tested_cluster) (
                kanary_error{namespace="{{args.namespace}}", type=~"{{args.types}}", tested_cluster=~"{{args.clusters}}"}
              ) == 0
            )
