---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: analysis-template-manager
  labels:
    app.kubernetes.io/part-of: argocd
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - analysistemplates
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: analysis-template-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: analysis-template-manager
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd-local
