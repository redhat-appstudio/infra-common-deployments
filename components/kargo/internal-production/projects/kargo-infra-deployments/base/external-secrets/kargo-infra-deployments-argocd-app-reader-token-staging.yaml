---
# Syncs the staging argocd-infra-deployments Application reader token into
# the Kargo project namespace so ring-1 promotions can call secret(...).token.
# Populate Vault first (staging SA token -> KV key below, property: token).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kargo-infra-deployments-argocd-app-reader-token-staging
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: staging/devprod/kargo-infra-deployments-argocd-app-reader-staging
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: appsre-stonesoup-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    name: kargo-infra-deployments-argocd-app-reader-token-staging
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: generic
