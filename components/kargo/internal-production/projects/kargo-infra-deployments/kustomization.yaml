---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kargo-infra-deployments

resources:
  - base
  - dummy-deployment
  - konflux-operator
  - authentication
  - etcd-shield
  - artifact-registry-proxy
  - container-image-proxy

components:
  - ../../e2e-secrets

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
