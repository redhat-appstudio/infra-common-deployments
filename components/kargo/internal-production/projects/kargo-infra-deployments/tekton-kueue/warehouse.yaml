---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: tekton-kueue
spec:
  freightCreationPolicy: Automatic
  interval: 2h0m0s
  subscriptions:
    - image:
        repoURL: quay.io/openshift-pipeline/pipelines-scheduler-rhel10
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 5
        allowTags: nightly
