---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: ring-0-dummy-deployment
  annotations:
    kargo.akuity.io/color: cyan
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: dummy-deployment
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: srcPath
          value: ./src
        - name: component
          value: ${{ ctx.targetFreight.origin.name }}
        - name: targetRing
          value: ring-0
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: https://github.com/redhat-appstudio/infra-deployments.git
            checkout:
              - branch: main
                path: ${{ vars.srcPath }}
        - task:
            name: dummy-deployment-promote-ring-0
          as: dummy-deployment-promote
          vars:
            - name: srcPath
              value: ${{ vars.srcPath }}
        - task:
            name: git-workflow-infra-deployments
          as: git-workflow
          vars:
            - name: srcPath
              value: ${{ vars.srcPath }}
            - name: component
              value: ${{ vars.component }}
            - name: targetRing
              value: ${{ vars.targetRing }}
            - name: skipProwChecks
              value: "false"
            - name: clusters
              value: ""
            - name: waitForSync
              value: "false"
            - name: githubPatSecret
              value: kargo-promotion-credentials
