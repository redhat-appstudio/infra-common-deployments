---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: pulp-access-controller
spec:
  freightCreationPolicy: Automatic
  interval: 2h0m0s
  subscriptions:
    - git:
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        commitSelectionStrategy: NewestFromBranch
        branch: main
        includePaths:
          - components/pulp-access-controller/base
    - image:
        repoURL: quay.io/redhat-user-workloads/pulp-access-controller-tenant/pulp-access-controller-ca9ff
        imageSelectionStrategy: SemVer
        constraint: '>=1.3.1 <2.0.0'
        discoveryLimit: 5
        allowTagsRegexes:
          - '^v1\.[0-9]+\.[0-9]+$'
