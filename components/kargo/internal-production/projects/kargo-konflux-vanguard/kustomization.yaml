---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kargo-konflux-vanguard

resources:
  - base
  - components/artifact-registry-proxy
  - components/container-image-proxy
  - components/notification-controller

components:
  - ../../kargo-shared-promotion-tasks
  - ../../kargo-shared-verifications

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
