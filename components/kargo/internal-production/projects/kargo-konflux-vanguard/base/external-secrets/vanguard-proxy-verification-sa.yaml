---
# Launcher ServiceAccount tokens for the deployed proxy regression suite.
# Add one JSON value per target cluster under production/vanguard using a
# vanguard-proxy-<cluster> key. Each value must contain a non-empty token field.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vanguard-proxy-verification-sa
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  dataFrom:
    - find:
        path: production/vanguard
        name:
          regexp: "^production/vanguard/vanguard-proxy-.*"
        decodingStrategy: None
      rewrite:
        - regexp:
            source: "production/vanguard/(.*)"
            target: "$1"
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: appsre-stonesoup-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    name: vanguard-proxy-verification-sa
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: generic
