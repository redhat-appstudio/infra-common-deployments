# Kubernetes RBAC — grants the kargo-manager ServiceAccount the patch
# permissions defined in kargo-promoter-extras: aborting promotions,
# approving freight, and aborting verifications.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kargo-manager-promoter-extras
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kargo-promoter-extras
subjects:
  - kind: ServiceAccount
    name: kargo-manager
    namespace: kargo
