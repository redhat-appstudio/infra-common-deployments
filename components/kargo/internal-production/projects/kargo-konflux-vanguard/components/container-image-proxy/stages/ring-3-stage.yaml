---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: ring-3-container-image-proxy
  labels:
    konflux-environment: production
  annotations:
    kargo.akuity.io/color: red
spec:
  shard: infra-deployments-production
  requestedFreight:
    - origin:
        kind: Warehouse
        name: container-image-proxy-manifest-wh
      sources:
        stages:
          - ring-2-container-image-proxy
        requiredSoakTime: 48h0m0s
    - origin:
        kind: Warehouse
        name: container-image-proxy-chart-wh
      sources:
        stages:
          - ring-2-container-image-proxy
        requiredSoakTime: 48h0m0s
  promotionTemplate:
    spec:
      vars:
        - name: srcPath
          value: ./src
        - name: repoURL
          value: https://github.com/redhat-appstudio/infra-deployments.git
        - name: component
          value: container-image-proxy
        - name: targetRing
          value: ring-3
        - name: prevRing
          value: ring-2
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.repoURL }}
            checkout:
              - branch: main
                path: ${{ vars.srcPath }}
        - task:
            name: promote-container-image-proxy-manifests
          as: promote-container-image-proxy
          vars:
            - name: srcPath
              value: ${{ vars.srcPath }}
            - name: component
              value: ${{ vars.component }}
            - name: prevRing
              value: ${{ vars.prevRing }}
            - name: targetRing
              value: ${{ vars.targetRing }}
        - uses: git-commit
          as: commit
          config:
            path: ${{ vars.srcPath }}
            message: |
              chore(${{ ctx.stage }}): promote ${{ vars.component }} to ${{ vars.targetRing }}
        # If the commit is skipped, set the freight promotion as no-op for Ring 3. This can happen with hotfixes.
        - uses: set-metadata
          as: annotate-freight-as-no-op
          config:
            updates:
              - name: ${{ ctx.targetFreight.name }}
                kind: Freight
                values:
                  noOpRing3: "${{ status('commit') == 'Skipped' ? 'yes' : 'no' }}"
        # Create promotionAsNoOp as an output since the Kargo context uses a cached version of Freight taken from
        # the beginning of the promotion, and thus cannot see the updated Freight metadata from the previous step.
        - uses: compose-output
          as: set-promotion-as-no-op
          config:
            promotionAsNoOp: "${{ status('commit') == 'Skipped' ? 'yes' : 'no' }}"
        - uses: git-push
          as: push
          if: ${{ outputs['set-promotion-as-no-op'].promotionAsNoOp != 'yes' }}
          config:
            path: ${{ vars.srcPath }}
            targetBranch: ${{ ctx.project }}/${{ vars.component }}/${{ vars.targetRing }}
            force: true
        - uses: git-open-pr
          as: open-pr
          continueOnError: true
          if: ${{ outputs['set-promotion-as-no-op'].promotionAsNoOp != 'yes' }}
          config:
            repoURL: ${{ vars.repoURL }}
            sourceBranch: ${{ ctx.project }}/${{ vars.component }}/${{ vars.targetRing }}
            targetBranch: main
            title: "chore(${{ ctx.stage }}): promote ${{ vars.component }} to ${{ vars.targetRing }}"
            description: |
              ### ${{ ctx.stage }}

              | | |
              |---|---|
              | **Component** | `${{ vars.component }}` |
              | **Project** | `${{ ctx.project }}` |
              | **Promotion** | `${{ ctx.promotion }}` |
              | **Freight** | `${{ ctx.targetFreight.alias }}` |

              ---

              ${{ (outputs['promote-' + vars.component + '.pr-meta']?.details) ?? ('Promotes `' + vars.component + '` to **' + ctx.stage + '**.') }}

              ---

              **Ring 3 — Production.** Requires manual approval.

              > Branch is force-pushed each promotion cycle. Do not commit directly.
            labels:
              - ${{ vars.targetRing }}
              - manual-promotion
              - component/${{ vars.component }}
        - task:
            name: github-ci-gate
          as: github-ci-gate
          vars:
            - name: commitSHA
            # If the push step is skipped, the commit SHA is set to an empty string instead of being nil.
              value: "${{ outputs['push']?.commit ?? '' }}"
            - name: promotionAsNoOp
              value: "${{ outputs['set-promotion-as-no-op'].promotionAsNoOp }}"
            - name: skipProwChecks
              value: "true"
        - uses: http
          as: find-pr
          if: ${{ outputs['set-promotion-as-no-op'].promotionAsNoOp != 'yes' && status('github-ci-gate::wait-for-check-runs') == 'Succeeded' }}
          retry:
            timeout: 5m0s
            errorThreshold: 10
          config:
            method: GET
            url: https://api.github.com/repos/redhat-appstudio/infra-deployments/pulls?head=redhat-appstudio:${{ ctx.project }}/${{ vars.component }}/${{ vars.targetRing }}&state=open
            headers:
              - name: Authorization
                value: Bearer ${{ sharedSecret('konflux-kargo-git-operations').github_pat }}
              - name: Accept
                value: application/vnd.github+json
            outputs:
              - name: prNumber
                fromExpression: response.body[0].number
            successExpression: response.status == 200 && len(response.body) > 0
            timeout: 30s
        - uses: git-wait-for-pr
          as: wait-for-pr
          if: ${{ outputs['set-promotion-as-no-op'].promotionAsNoOp != 'yes' && status('github-ci-gate::wait-for-check-runs') == 'Succeeded' }}
          retry:
            timeout: 168h0m0s
          config:
            repoURL: ${{ vars.repoURL }}
            prNumber: ${{ outputs['find-pr'].prNumber }}
        - uses: http
          as: verify-merged
          if: ${{ outputs['set-promotion-as-no-op'].promotionAsNoOp != 'yes' && status('github-ci-gate::wait-for-check-runs') == 'Succeeded' }}
          config:
            method: GET
            url: https://api.github.com/repos/redhat-appstudio/infra-deployments/pulls/${{ outputs['find-pr'].prNumber }}
            headers:
              - name: Authorization
                value: Bearer ${{ sharedSecret('konflux-kargo-git-operations').github_pat }}
              - name: Accept
                value: application/vnd.github+json
            outputs:
              - name: mergeCommitSHA
                fromExpression: response.body.merge_commit_sha
            successExpression: response.status == 200 && response.body.merged == true
            failureExpression: response.status == 200 && response.body.state == 'closed' && response.body.merged == false
            timeout: 30s
        - task:
            name: wait-for-infra-deployments-argocd-sync
          as: wait-for-sync
          vars:
            - name: commitSHA
              value: "${{ outputs['verify-merged']?.mergeCommitSHA ?? '' }}"
            - name: promotionAsNoOp
              value: "${{ outputs['set-promotion-as-no-op'].promotionAsNoOp }}"
            - name: component
              value: ${{ vars.component }}
            - name: clusters
              value: "stone-prd-rh01"
            - name: tokenSecret
              value: argocd-app-reader-token
