---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: container-image-proxy-manifest-wh
spec:
  freightCreationPolicy: Automatic
  interval: 2h0m0s
  subscriptions:
    - git:
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        commitSelectionStrategy: NewestFromBranch
        branch: main
        includePaths:
          - 'components/container-image-proxy/base'
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: container-image-proxy-chart-wh
spec:
  freightCreationPolicy: Automatic
  interval: 2h0m0s
  subscriptions:
    - chart:
        repoURL: oci://quay.io/konflux-ci/caching/caching-helm
        semverConstraint: ^0.1.0
        discoveryLimit: 5
