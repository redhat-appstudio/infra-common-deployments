---
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: prepare-smee-client-bundle
spec:
  vars:
    - name: srcPath
    - name: freightPath
    - name: repoURL
    - name: componentPath
    - name: targetRing
    - name: sidecarImageRepoURL
      value: quay.io/konflux-ci/smee-sidecar
    - name: gosmeeImageRepoURL
      value: ghcr.io/chmouel/gosmee
  steps:
    - uses: fail
      as: validate-bundle
      if: >-
        ${{ ctx.targetFreight.origin.name != 'smee-client' || !(commitFrom(vars.repoURL).ID matches '^[0-9a-f]{40}$') ||
        !(imageFrom(vars.gosmeeImageRepoURL).Tag matches '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$') ||
        !(imageFrom(vars.sidecarImageRepoURL).Tag matches '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$') }}
      config:
        message: Expected smee-client Freight containing a Git commit and two valid image tags.
    - uses: delete
      as: delete-old-base-snapshot
      if: ${{ status('validate-bundle') == 'Skipped' }}
      config:
        path: ${{ vars.srcPath }}/${{ vars.componentPath }}/rings/${{ vars.targetRing }}/base/base-snapshot
    - uses: copy
      as: copy-freight-manifests
      if: ${{ status('delete-old-base-snapshot') == 'Succeeded' }}
      config:
        inPath: ${{ vars.freightPath }}/${{ vars.componentPath }}/base
        outPath: ${{ vars.srcPath }}/${{ vars.componentPath }}/rings/${{ vars.targetRing }}/base/base-snapshot
    - uses: kustomize-set-image
      as: update-bundle-images
      if: ${{ status('copy-freight-manifests') == 'Succeeded' }}
      config:
        path: ${{ vars.srcPath }}/${{ vars.componentPath }}/rings/${{ vars.targetRing }}/base
        images:
          - image: ${{ vars.gosmeeImageRepoURL }}
            tag: ${{ quote(imageFrom(vars.gosmeeImageRepoURL).Tag) }}
          - image: ${{ vars.sidecarImageRepoURL }}
            tag: ${{ quote(imageFrom(vars.sidecarImageRepoURL).Tag) }}
    - uses: compose-output
      as: result
      if: >-
        ${{ status('validate-bundle') == 'Skipped' && status('delete-old-base-snapshot') == 'Succeeded' && status('copy-freight-manifests')
        == 'Succeeded' && status('update-bundle-images') == 'Succeeded' }}
      config:
        prepared: 'yes'
        prSummary: |
          Update smee-client with:

          - **gosmee:** `${{ imageFrom(vars.gosmeeImageRepoURL).Tag }}`
          - **smee-sidecar:** `${{ imageFrom(vars.sidecarImageRepoURL).Tag }}`
          - **Manifests:** [`${{ commitFrom(vars.repoURL).ID[0:12] }}`](https://github.com/redhat-appstudio/infra-deployments/commit/${{ commitFrom(vars.repoURL).ID }})
