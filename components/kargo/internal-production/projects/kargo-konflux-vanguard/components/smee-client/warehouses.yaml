---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: smee-client
spec:
  freightCreationPolicy: Automatic
  interval: 2h0m0s
  subscriptions:
    - git:
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        commitSelectionStrategy: NewestFromBranch
        branch: main
        includePaths:
          - components/smee-client/base
    - image:
        repoURL: quay.io/konflux-ci/gosmee
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 5
        allowTagsRegexes:
          - ^[0-9a-f]{40}$
    - image:
        repoURL: quay.io/konflux-ci/smee-sidecar
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 5
        allowTagsRegexes:
          - ^[0-9a-f]{40}$
