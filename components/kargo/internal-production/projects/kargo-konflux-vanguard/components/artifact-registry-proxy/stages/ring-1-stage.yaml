---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: ring-1-artifact-registry-proxy
  labels:
    konflux-environment: staging
  annotations:
    kargo.akuity.io/color: yellow
spec:
  shard: infra-deployments-staging
  requestedFreight:
    - origin:
        kind: Warehouse
        name: artifact-registry-proxy-manifest-wh
      sources:
        stages:
          - ring-0-artifact-registry-proxy
    - origin:
        kind: Warehouse
        name: artifact-registry-proxy-chart-wh
      sources:
        stages:
          - ring-0-artifact-registry-proxy
  verification:
    analysisTemplates:
      - name: kanary-staging
    args:
      - name: clusters
        value: stone-stg-rh01|stone-stage-p01
      - name: expected-cluster-count
        value: "2"
  promotionTemplate:
    spec:
      vars:
        - name: srcPath
          value: ./src
        - name: repoURL
          value: https://github.com/redhat-appstudio/infra-deployments.git
        - name: component
          value: artifact-registry-proxy
        - name: targetRing
          value: ring-1
        - name: prevRing
          value: ring-0
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.repoURL }}
            checkout:
              - branch: main
                path: ${{ vars.srcPath }}
        - task:
            name: promote-artifact-registry-proxy-manifests
          as: promote-artifact-registry-proxy
          vars:
            - name: srcPath
              value: ${{ vars.srcPath }}
            - name: component
              value: ${{ vars.component }}
            - name: prevRing
              value: ${{ vars.prevRing }}
            - name: targetRing
              value: ${{ vars.targetRing }}
        - uses: git-commit
          as: commit
          config:
            path: ${{ vars.srcPath }}
            message: |
              chore(${{ ctx.stage }}): promote ${{ vars.component }} to ${{ vars.targetRing }}
        # If the commit is skipped, set the freight promotion as no-op for Ring 1. This can happen with hotfixes.
        - uses: set-metadata
          as: annotate-freight-as-no-op
          config:
            updates:
              - name: ${{ ctx.targetFreight.name }}
                kind: Freight
                values:
                  noOpRing1: "${{ status('commit') == 'Skipped' ? 'true' : 'false' }}"
        # Create promotionAsNoOp as an output since the Kargo context uses a cached version of Freight taken from
        # the beginning of the promotion, and thus cannot see the updated Freight metadata from the previous step.
        - uses: compose-output
          as: set-promotion-as-no-op
          config:
            promotionAsNoOp: "${{ status('commit') == 'Skipped' ? 'yes' : 'no' }}"
        - uses: git-push
          as: push
          if: ${{ outputs['set-promotion-as-no-op'].promotionAsNoOp != 'yes' }}
          config:
            path: ${{ vars.srcPath }}
            targetBranch: ${{ ctx.project }}/${{ vars.component }}/${{ vars.targetRing }}
            force: true
        - uses: git-open-pr
          as: open-pr
          if: ${{ outputs['set-promotion-as-no-op'].promotionAsNoOp != 'yes' }}
          continueOnError: true
          config:
            repoURL: ${{ vars.repoURL }}
            sourceBranch: ${{ ctx.project }}/${{ vars.component }}/${{ vars.targetRing }}
            targetBranch: main
            title: "chore(${{ ctx.stage }}): promote ${{ vars.component }} to ${{ vars.targetRing }}"
            description: |
              ### ${{ ctx.stage }}

              | | |
              |---|---|
              | **Component** | `${{ vars.component }}` |
              | **Project** | `${{ ctx.project }}` |
              | **Promotion** | `${{ ctx.promotion }}` |
              | **Freight** | `${{ ctx.targetFreight.alias }}` |

              ---

              ${{ (outputs['promote-' + vars.component + '.pr-meta']?.details) ?? ('Promotes `' + vars.component + '` to **' + ctx.stage + '**.') }}

              ---

              Auto-merged after CI passes. No manual approval required for Ring 1.

              > Branch is force-pushed each promotion cycle. Do not commit directly.
            labels:
              - ring-1
              - automated-promotion
              - component/${{ vars.component }}
        - task:
            name: github-ci-gate
          as: github-ci-gate
          vars:
            - name: commitSHA
            # If the push step is skipped, the commit SHA is set to an empty string instead of being nil.
              value: "${{ outputs['push']?.commit ?? '' }}"
            - name: promotionAsNoOp
              value: "${{ outputs['set-promotion-as-no-op'].promotionAsNoOp }}"
            - name: skipProwChecks
              value: "true"
        - uses: http
          as: find-pr
          if: ${{ outputs['set-promotion-as-no-op'].promotionAsNoOp != 'yes' }}
          retry:
            timeout: 5m0s
            errorThreshold: 10
          config:
            method: GET
            url: https://api.github.com/repos/redhat-appstudio/infra-deployments/pulls?head=redhat-appstudio:${{ ctx.project }}/${{ vars.component }}/${{ vars.targetRing }}&state=open
            headers:
              - name: Authorization
                value: Bearer ${{ sharedSecret('konflux-kargo-git-operations').github_pat }}
              - name: Accept
                value: application/vnd.github+json
            outputs:
              - name: prNumber
                fromExpression: response.body[0].number
            successExpression: response.status == 200 && len(response.body) > 0
            timeout: 30s
        - uses: git-merge-pr
          as: merge-pr
          if: ${{ outputs['set-promotion-as-no-op'].promotionAsNoOp != 'yes' }}
          retry:
            timeout: 2h0m0s
          config:
            repoURL: ${{ vars.repoURL }}
            prNumber: ${{ outputs['find-pr'].prNumber }}
            mergeMethod: squash
            wait: true
        - task:
            name: wait-for-infra-deployments-argocd-sync
          as: wait-for-sync
          vars:
            - name: commitSHA
            # If the merge PR step is skipped, the commit SHA is set to an empty string instead of being nil.
              value: "${{ outputs['merge-pr']?.commit ?? '' }}"
            - name: promotionAsNoOp
              value: "${{ outputs['set-promotion-as-no-op'].promotionAsNoOp }}"
            - name: component
              value: ${{ vars.component }}
            - name: clusters
              value: "stone-stg-rh01|stone-stage-p01"
            - name: tokenSecret
              value: argocd-app-reader-token-staging
