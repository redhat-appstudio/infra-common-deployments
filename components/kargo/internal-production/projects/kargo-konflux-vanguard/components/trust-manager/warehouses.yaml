---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: trust-manager
spec:
  freightCreationPolicy: Automatic
  interval: 2h0m0s
  subscriptions:
    - chart:
        repoURL: https://charts.jetstack.io
        name: trust-manager
        # Stay within the deployed pre-1.0 minor until explicitly reviewed.
        semverConstraint: ^0.19.0
        discoveryLimit: 5
