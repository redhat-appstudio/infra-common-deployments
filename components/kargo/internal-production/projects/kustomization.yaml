apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kargo-infra-common
  - kargo-konflux-core
  - kargo-konflux-infrastructure
  - kargo-konflux-kubearchive
  - kargo-konflux-monitoring
  - kargo-konflux-vanguard
  - kargo-production-playground
  - kargo-konflux-pulp
  - kargo-konflux-mintmaker
  - retained-project-namespaces.yaml

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
