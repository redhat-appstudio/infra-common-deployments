---
# Runs Konflux conformance tests against a staging cluster after promotion.
#
# Credentials are read from the konflux-conformance-sa secret (mounted as
# a volume). The cluster-specific JSON blob (ca.crt + token) is resolved
# by convention: konflux-conformance-<cluster-name>. GitHub credentials
# live under the fixed key konflux-conformance-tests-credentials.
#
# Required args: cluster-url, cluster-name
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: conformance-konflux-e2e
spec:
  args:
    - name: cluster-url
    - name: cluster-name
  metrics:
    - name: conformance-tests
      initialDelay: 2m
      consecutiveSuccessLimit: 1
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 2400
            template:
              spec:
                restartPolicy: Never
                volumes:
                  - name: credentials
                    secret:
                      secretName: konflux-conformance-sa
                containers:
                  - name: conformance
                    image: registry.access.redhat.com/ubi9/go-toolset:1.26
                    securityContext:
                      allowPrivilegeEscalation: false
                    resources:
                      requests:
                        memory: "4Gi"
                        cpu: "2"
                      limits:
                        memory: "8Gi"
                        cpu: "4"
                    volumeMounts:
                      - name: credentials
                        mountPath: /credentials
                        readOnly: true
                    env:
                      - name: CLUSTER_URL
                        value: "{{args.cluster-url}}"
                      - name: CLUSTER_NAME
                        value: "{{args.cluster-name}}"
                      - name: E2E_APPLICATIONS_NAMESPACE
                        value: konflux-conformance-tests
                      - name: E2E_MANAGED_NAMESPACE
                        value: konflux-managed-tests
                      - name: MY_GITHUB_ORG
                        value: konflux-ci
                      - name: E2E_REPO
                        value: testrepo-private
                      - name: E2E_ITS_REPO
                        value: testrepo
                      - name: TEST_ENVIRONMENT
                        value: upstream
                      - name: GOFLAGS
                        value: "-count=1"
                      - name: GOPATH
                        value: /tmp/gopath
                      - name: HOME
                        value: /tmp
                      - name: GOMAXPROCS
                        value: "4"
                    command:
                      - /bin/bash
                      - -c
                      - |
                        set -euo pipefail

                        mkdir -p /tmp/bin
                        export PATH="/tmp/bin:${PATH}"

                        curl -sSL "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz" \
                          -o /tmp/oc.tar.gz
                        tar xzf /tmp/oc.tar.gz -C /tmp/bin oc kubectl
                        rm /tmp/oc.tar.gz

                        curl -sSL "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64" \
                          -o /tmp/bin/jq
                        chmod +x /tmp/bin/jq

                        cluster_creds="/credentials/konflux-conformance-${CLUSTER_NAME}"
                        BEARER_TOKEN=$(jq -r '.token' "${cluster_creds}")
                        jq -r '.["ca.crt"]' "${cluster_creds}" > /tmp/ca.crt
                        export GITHUB_TOKEN=$(jq -r '.github_pat' /credentials/konflux-conformance-tests-credentials)

                        mkdir -p /tmp/.kube
                        cat > /tmp/.kube/config << KUBECONFIG
                        apiVersion: v1
                        kind: Config
                        clusters:
                        - cluster:
                            server: ${CLUSTER_URL}
                            certificate-authority: /tmp/ca.crt
                          name: target
                        contexts:
                        - context:
                            cluster: target
                            user: conformance-sa
                            namespace: ${E2E_APPLICATIONS_NAMESPACE}
                          name: default
                        current-context: default
                        users:
                        - name: conformance-sa
                          user:
                            token: ${BEARER_TOKEN}
                        KUBECONFIG
                        export KUBECONFIG=/tmp/.kube/config

                        echo "Connected as: $(oc whoami)"

                        git clone --depth=1 --branch=main \
                          https://github.com/konflux-ci/konflux-ci.git /tmp/src
                        cd /tmp/src/test/go-tests

                        CUSTOM_DOCKER_BUILD_OCI_TA_MIN_PIPELINE_BUNDLE=$(grep -A1 'name: docker-build-oci-ta-min' \
                          /tmp/src/operator/pkg/manifests/build-service/manifests.yaml \
                          | grep 'bundle:' | sed 's/.*bundle: *//' | tr -d ' \r')
                        export CUSTOM_DOCKER_BUILD_OCI_TA_MIN_PIPELINE_BUNDLE

                        go test -v -timeout 30m -count=1 -p 1 ./tests/conformance/...
