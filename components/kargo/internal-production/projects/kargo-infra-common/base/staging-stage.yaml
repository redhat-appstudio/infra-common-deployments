---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: ring-1-staging
  annotations:
    kargo.akuity.io/color: yellow
spec:
  shard: infra-common-deployments-staging
  requestedFreight:
    - origin:
        kind: Warehouse
        name: kargo
      sources:
        direct: true
    - origin:
        kind: Warehouse
        name: rover-group-sync
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: repoURL
          value: https://github.com/redhat-appstudio/infra-common-deployments.git
        - name: component
          value: ${{ ctx.targetFreight.origin.name }}
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.repoURL }}
            checkout:
              - branch: main
                path: ./src
        - task:
            name: kargo-promote-ring-1
          as: kargo-promote
          vars:
            - name: srcPath
              value: ./src
        - task:
            name: rover-group-sync-promote-ring-1
          as: rover-group-sync-promote
          vars:
            - name: srcPath
              value: ./src
        - uses: git-commit
          as: commit
          config:
            path: ./src
            message: |
              chore(${{ ctx.stage }}): promote ${{ vars.component }}
        # If the commit is skipped, set the freight promotion as no-op for Ring 1. This can happen with hotfixes.
        - uses: set-metadata
          as: annotate-freight-as-no-op
          config:
            updates:
              - name: ${{ ctx.targetFreight.name }}
                kind: Freight
                values:
                  noOpRing1: "${{ status('commit') == 'Skipped' ? 'true' : 'false' }}"
        # Create promotionAsNoOp as an output since the Kargo context uses a cached version of Freight taken from
        # the beginning of the promotion, and thus cannot see the updated Freight metadata from the previous step.
        - uses: compose-output
          as: set-promotion-as-no-op
          config:
            promotionAsNoOp: "${{ status('commit') == 'Skipped' ? 'yes' : 'no' }}"
        - uses: git-push
          as: push
          if: ${{ outputs['set-promotion-as-no-op'].promotionAsNoOp != 'yes' }}
          config:
            path: ./src
            targetBranch: ${{ ctx.project }}/${{ vars.component }}/ring-1-staging
            force: true
        - uses: git-open-pr
          as: open-pr
          if: ${{ outputs['set-promotion-as-no-op'].promotionAsNoOp != 'yes' }}
          continueOnError: true
          config:
            repoURL: ${{ vars.repoURL }}
            sourceBranch: ${{ ctx.project }}/${{ vars.component }}/ring-1-staging
            targetBranch: main
            title: "chore(${{ ctx.stage }}): promote ${{ vars.component }} to staging"
            description: |
              ## Automated Promotion — Staging (Ring 1)

              **Component:** `${{ vars.component }}`
              **Project:** `${{ ctx.project }}`
              **Stage:** `${{ ctx.stage }}`

              This PR was automatically created by [Kargo](https://kargo.io) as part of the
              `kargo-infra-common` promotion pipeline.

              ### What changed
              - Updated `${{ vars.component }}` configuration in the **internal-staging** environment
                to align with the latest freight from the upstream warehouse.

              ### Merge policy
              This PR will be automatically merged once all required CI checks pass.

              > **Note:** Do not manually edit this branch — it is force-pushed on each promotion cycle.
            labels:
              - ring-1
              - staging
              - automated-promotion
              - component/${{ vars.component }}
        - task:
            name: github-ci-gate
          as: github-ci-gate
          vars:
            - name: commitSHA
            # If the push step is skipped, the commit SHA is set to an empty string instead of being nil.
              value: "${{ outputs['push']?.commit ?? '' }}"
            - name: promotionAsNoOp
              value: "${{ outputs['set-promotion-as-no-op'].promotionAsNoOp }}"
        - uses: git-merge-pr
          if: ${{ status('open-pr') != 'Errored' && outputs['set-promotion-as-no-op'].promotionAsNoOp != 'yes' }}
          as: merge-pr
          retry:
            timeout: 2h0m0s
            errorThreshold: 240
          config:
            repoURL: ${{ vars.repoURL }}
            prNumber: ${{ outputs['open-pr'].pr.id }}
            wait: true
            mergeMethod: squash
        # Wait until argocd-local has started syncing the merge commit before
        # argocd-wait (which is not revision-aware and can race on a prior sync).
        - task:
            name: wait-for-argocd-revision
          as: wait-for-revision
          vars:
            - name: commitSHA
            # If the merge PR step is skipped, the commit SHA is set to an empty string instead of being nil.
              value: "${{ outputs['merge-pr']?.commit ?? '' }}"
            - name: promotionAsNoOp
              value: "${{ outputs['set-promotion-as-no-op'].promotionAsNoOp }}"
            - name: tokenSecret
              value: kargo-infra-common-argocd-app-reader-token-staging
            - name: appURL
              value: https://kubernetes.default.svc/apis/argoproj.io/v1alpha1/namespaces/argocd-local/applications/${{ vars.component }}-in-cluster
        - uses: argocd-wait
          if: ${{ status('open-pr') != 'Errored' && outputs['set-promotion-as-no-op'].promotionAsNoOp != 'yes' }}
          as: argocd-wait
          config:
            apps:
              - name: ${{ vars.component }}-in-cluster
                namespace: argocd-local
