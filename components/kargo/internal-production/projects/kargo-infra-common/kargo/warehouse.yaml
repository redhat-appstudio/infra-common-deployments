---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: kargo
spec:
  freightCreationPolicy: Automatic
  interval: 5m0s
  subscriptions:
    - chart:
        repoURL: oci://ghcr.io/akuity/kargo-charts/kargo
        semverConstraint: ^1.10.0
        discoveryLimit: 5
    - image:
        repoURL: quay.io/konflux-ci/kargo
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 5
        # Release tag {{ oci_version }} = git describe --long (e.g. v1.11.2-0-gabcdef1)
        allowTagsRegexes:
          - ^v?1\.(?:1[0-9]+|[2-9][0-9]+)\.\d+-\d+-g[0-9a-f]+$
    - image:
        repoURL: quay.io/konflux-ci/dex
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 5
        allowTagsRegexes:
          - ^[0-9a-f]{40}$
  # Compare major.minor.patch of the best-fit chart vs image (1.11.2 vs v1.11.2-N-gSHA).
  # Kargo does not search discoveryLimit for a matching pair; if the newest chart and
  # newest image disagree, Freight is skipped until they align (CriteriaSatisfied=False).
  freightCreationCriteria:
    expression: |
      semverParse(imageFrom('quay.io/konflux-ci/kargo').Tag).Major() == semverParse(chartFrom('oci://ghcr.io/akuity/kargo-charts/kargo').Version).Major() &&
      semverParse(imageFrom('quay.io/konflux-ci/kargo').Tag).Minor() == semverParse(chartFrom('oci://ghcr.io/akuity/kargo-charts/kargo').Version).Minor() &&
      semverParse(imageFrom('quay.io/konflux-ci/kargo').Tag).Patch() == semverParse(chartFrom('oci://ghcr.io/akuity/kargo-charts/kargo').Version).Patch()
