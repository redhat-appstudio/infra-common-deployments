---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: kargo
spec:
  freightCreationPolicy: Automatic
  interval: 5m0s
  subscriptions:
    - chart:
        repoURL: oci://ghcr.io/akuity/kargo-charts/kargo
        semverConstraint: ^1.10.0
        discoveryLimit: 5
    - image:
        repoURL: quay.io/konflux-ci/kargo
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 5
        allowTagsRegexes:
          - ^1\.(?:1[0-9]+|[2-9][0-9]+)-[0-9a-f]{7}$
    - image:
        repoURL: quay.io/konflux-ci/dex
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 5
        allowTagsRegexes:
          - ^[0-9a-f]{40}$
  # Compare major.minor of the best-fit chart vs image only (e.g. 1.11.2 vs 1.11-<sha>).
  # Kargo does not search discoveryLimit for a matching pair; if the newest chart and
  # newest image disagree, Freight is skipped until they align (CriteriaSatisfied=False).
  freightCreationCriteria:
    expression: |
      split(imageFrom('quay.io/konflux-ci/kargo').Tag, '-')[0] ==
        string(semverParse(chartFrom('oci://ghcr.io/akuity/kargo-charts/kargo').Version).Major()) + '.' +
        string(semverParse(chartFrom('oci://ghcr.io/akuity/kargo-charts/kargo').Version).Minor())
