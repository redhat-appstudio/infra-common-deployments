---
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: kargo-promote-ring-2
spec:
  vars:
    - name: srcPath
  steps:
    - uses: yaml-update
      as: update-kargo
      if: ${{ ctx.targetFreight.origin.name == "kargo" }}
      config:
        path: ${{ vars.srcPath }}/components/kargo/internal-production/deployment/kargo-helm-generator.yaml
        updates:
          - key: version
            value: ${{ chartFrom("oci://ghcr.io/akuity/kargo-charts/kargo").Version }}
          - key: valuesInline.image.tag
            value: ${{ imageFrom("quay.io/konflux-ci/kargo").Tag }}
          - key: valuesInline.api.oidc.dex.image.tag
            value: ${{ imageFrom("quay.io/konflux-ci/dex").Tag }}
    # Shards talk to the production control plane, keep versions in lockstep.
    # No dex: controller-only (api.enabled: false); yaml-update fails on missing keys.
    - uses: yaml-update
      as: update-kargo-shard-infra-common-staging
      if: ${{ ctx.targetFreight.origin.name == "kargo" }}
      config:
        path: ${{ vars.srcPath }}/components/kargo-shard/internal-staging/infra-common-deployments/deployment/kargo-shard-helm-generator.yaml
        updates:
          - key: version
            value: ${{ chartFrom("oci://ghcr.io/akuity/kargo-charts/kargo").Version }}
          - key: valuesInline.image.tag
            value: ${{ imageFrom("quay.io/konflux-ci/kargo").Tag }}
    - uses: yaml-update
      as: update-kargo-shard-infra-deployments-staging
      if: ${{ ctx.targetFreight.origin.name == "kargo" }}
      config:
        path: ${{ vars.srcPath }}/components/kargo-shard/internal-staging/infra-deployments/deployment/kargo-shard-helm-generator.yaml
        updates:
          - key: version
            value: ${{ chartFrom("oci://ghcr.io/akuity/kargo-charts/kargo").Version }}
          - key: valuesInline.image.tag
            value: ${{ imageFrom("quay.io/konflux-ci/kargo").Tag }}
    - uses: yaml-update
      as: update-kargo-shard-infra-deployments-production
      if: ${{ ctx.targetFreight.origin.name == "kargo" }}
      config:
        path: ${{ vars.srcPath }}/components/kargo-shard/internal-production/infra-deployments/deployment/kargo-shard-helm-generator.yaml
        updates:
          - key: version
            value: ${{ chartFrom("oci://ghcr.io/akuity/kargo-charts/kargo").Version }}
          - key: valuesInline.image.tag
            value: ${{ imageFrom("quay.io/konflux-ci/kargo").Tag }}
