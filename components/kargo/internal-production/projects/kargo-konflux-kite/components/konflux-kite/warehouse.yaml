---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: konflux-kite
spec:
  freightCreationPolicy: Automatic
  interval: 2h0m0s
  subscriptions:
    - git:
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        commitSelectionStrategy: NewestFromBranch
        branch: main
        includePaths:
          - components/konflux-kite/base
    # API and database migration images must have the same source SHA.
    # Discovery is independent; preparation rejects mismatched Freight.
    - image:
        repoURL: quay.io/konflux-ci/kite-prod
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 5
        allowTagsRegexes:
          - '^[0-9a-f]{40}$'
    - image:
        repoURL: quay.io/konflux-ci/kite-init
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 5
        allowTagsRegexes:
          - '^[0-9a-f]{40}$'
