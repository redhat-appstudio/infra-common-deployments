---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: image-rbac-proxy
spec:
  freightCreationPolicy: Automatic
  interval: 2h0m0s
  subscriptions:
    - git:
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        commitSelectionStrategy: NewestFromBranch
        branch: main
        includePaths:
          - components/image-rbac-proxy/base
    # The source-SHA image tag also selects the upstream deployment manifests.
    - image:
        repoURL: quay.io/konflux-ci/image-rbac-proxy
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 5
        allowTagsRegexes:
          - '^[0-9a-f]{40}$'
    # Memcached is an independent Ring 0-only override. Select stable releases below 3.0.0.
    - image:
        repoURL: quay.io/kubearchive/memcached
        imageSelectionStrategy: SemVer
        semverConstraint: '>=1.6.39 <3.0.0'
        discoveryLimit: 5
        allowTagsRegexes:
          - '^[12][.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$'
