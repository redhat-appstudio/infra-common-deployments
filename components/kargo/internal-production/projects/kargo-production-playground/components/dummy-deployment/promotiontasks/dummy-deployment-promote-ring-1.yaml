---
# Read the previous Git configuration before mutation; this is not live cluster state.
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: dummy-deployment-promote-ring-1
spec:
  vars:
    - name: srcPath
  steps:
    - uses: yaml-parse
      as: read-previous
      if: ${{ ctx.targetFreight.origin.name == "dummy-deployment" }}
      config:
        path: ${{ vars.srcPath }}/components/dummy-deployment/overlays/staging/kustomization.yaml
        outputs:
          - name: imageTag
            fromExpression: string(images[0].newTag ?? 'unknown')
          - name: manifestSource
            fromExpression: string(resources[1] ?? 'unknown')
    - uses: yaml-update
      as: update-dummy-deployment
      if: ${{ status('read-previous') == 'Succeeded' }}
      config:
        path: ${{ vars.srcPath }}/components/dummy-deployment/overlays/staging/kustomization.yaml
        updates:
          - key: images.0.newTag
            value: ${{ imageFrom("quay.io/redhat-appstudio-qe/dummy-deployment").Tag }}
          - key: resources.1
            value: https://github.com/flacatus/konflux-dummy-deploy//k8s?ref=${{ imageFrom("quay.io/redhat-appstudio-qe/dummy-deployment").Tag
              }}
    - uses: compose-output
      as: result
      if: ${{ status('update-dummy-deployment') == 'Succeeded' }}
      config:
        prepared: 'yes'
        prSummary: Update the dummy-deployment image and manifest reference in the staging overlay.
        prChanges:
          - kind: Image tag
            previous: ${{ quote(task.outputs['read-previous'].imageTag) }}
            proposed: ${{ quote(imageFrom("quay.io/redhat-appstudio-qe/dummy-deployment").Tag) }}
            path: components/dummy-deployment/overlays/staging/kustomization.yaml
          - kind: Manifest source
            previous: ${{ task.outputs['read-previous'].manifestSource }}
            proposed: https://github.com/flacatus/konflux-dummy-deploy//k8s?ref=${{ imageFrom("quay.io/redhat-appstudio-qe/dummy-deployment").Tag
              }}
            path: components/dummy-deployment/overlays/staging/kustomization.yaml
        prCompareURL: >-
          ${{ task.outputs['read-previous'].manifestSource matches '^https://github\\.com/flacatus/konflux-dummy-deploy//k8s\\?ref=[0-9a-f]{40}$'
          && imageFrom("quay.io/redhat-appstudio-qe/dummy-deployment").Tag matches '^[0-9a-f]{40}$' ? 'https://github.com/flacatus/konflux-dummy-deploy/compare/'
          + split(task.outputs['read-previous'].manifestSource, '?ref=')[1] + '...' + imageFrom("quay.io/redhat-appstudio-qe/dummy-deployment").Tag
          : '' }}
