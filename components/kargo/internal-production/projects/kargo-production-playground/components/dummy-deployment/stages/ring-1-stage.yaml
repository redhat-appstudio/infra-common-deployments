---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: ring-1-dummy-deployment
  labels:
    konflux-environment: staging
  annotations:
    kargo.akuity.io/color: yellow
spec:
  shard: infra-deployments-staging
  requestedFreight:
    - origin:
        kind: Warehouse
        name: dummy-deployment-manifest-wh
      sources:
        stages:
          - ring-0-dummy-deployment
    - origin:
        kind: Warehouse
        name: dummy-deployment-image-wh
      sources:
        stages:
          - ring-0-dummy-deployment
  verification:
    analysisTemplates:
      - name: kanary-staging
      - name: konflux-conformance-tests-stone-stage-p01
    args:
      - name: clusters
        value: stone-stg-rh01|stone-stage-p01
      - name: expected-cluster-count
        value: '2'
  promotionTemplate:
    spec:
      vars:
        - name: srcPath
          value: ./src
        - name: repoURL
          value: https://github.com/redhat-appstudio/infra-deployments.git
        - name: component
          value: dummy-deployment
        - name: targetRing
          value: ring-1
        - name: mergeMode
          value: auto
        # This Ring 1 deliberately skips Prow; callers enabling it must select a suite.
        - name: skipProwChecks
          value: 'true'
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.repoURL }}
            checkout:
              - branch: main
                path: ${{ vars.srcPath }}
        - task:
            name: dummy-deployment-promote-image
          as: promote-image
          vars:
            - name: srcPath
              value: ${{ vars.srcPath }}
            - name: component
              value: ${{ vars.component }}
            - name: ring
              value: ${{ vars.targetRing }}
        - task:
            name: dummy-deployment-promote-manifests
          as: promote-manifests
          vars:
            - name: srcPath
              value: ${{ vars.srcPath }}
            - name: component
              value: ${{ vars.component }}
            - name: ring
              value: ${{ vars.targetRing }}
            - name: baseManifestURL
              value: ${{ vars.repoURL }}
        - task:
            name: publish-promotion-pr
          as: publish
          vars:
            - name: srcPath
              value: ${{ vars.srcPath }}
            - name: component
              value: ${{ vars.component }}
            - name: targetRing
              value: ${{ vars.targetRing }}
            - name: prSummary
              value: >-
                ${{ outputs['promote-image::result']?.prepared == 'yes' && outputs['promote-manifests::result']?.prepared == 'yes'
                ? 'Update the dummy-deployment image, external repo, and base manifest references in ' + vars.targetRing + '.'
                : outputs['promote-image::result']?.prSummary ?? outputs['promote-manifests::result']?.prSummary ?? '' }}
            - name: prChanges
              value: ${{ outputs['promote-image::result']?.prChanges ?? outputs['promote-manifests::result']?.prChanges ?? [] }}
            - name: prCompareURL
              value: ${{ outputs['promote-image::result']?.prCompareURL ?? outputs['promote-manifests::result']?.prCompareURL ?? '' }}
            - name: prepared
              value: ${{ outputs['promote-image::result']?.prepared ?? outputs['promote-manifests::result']?.prepared ?? '' }}
            - name: baseCommitSHA
              value: ${{ outputs['clone'].commits[vars.srcPath] }}
            - name: mergeMode
              value: ${{ vars.mergeMode }}
            - name: skipProwChecks
              value: ${{ quote(vars.skipProwChecks) }}
        # Subsequent tasks use publication outputs because Freight is cached at start.
        - uses: set-metadata
          as: annotate-freight-as-no-op
          if: ${{ outputs['publish::result']?.published == 'yes' }}
          config:
            updates:
              - kind: Freight
                name: ${{ ctx.targetFreight.name }}
                values:
                  noOpRing1: ${{ outputs['publish::result'].promotionAsNoOp }}
        - task:
            name: verify-promotion-ci
          as: verify-ci
          vars:
            - name: published
              value: ${{ outputs['publish::result']?.published ?? '' }}
            - name: commitSHA
              value: ${{ outputs['publish::result']?.headCommitSHA ?? '' }}
            - name: promotionAsNoOp
              value: ${{ outputs['publish::result']?.promotionAsNoOp ?? '' }}
            - name: skipProwChecks
              value: ${{ quote(vars.skipProwChecks) }}
        - task:
            name: merge-promotion-pr
          as: merge
          vars:
            - name: passed
              value: ${{ outputs['ci::result']?.passed ?? '' }}
            - name: checkedSHA
              value: ${{ outputs['ci::result']?.checkedSHA ?? '' }}
            - name: headCommitSHA
              value: ${{ outputs['publish::result']?.headCommitSHA ?? '' }}
            - name: baseCommitSHA
              value: ${{ outputs['publish::result']?.baseCommitSHA ?? '' }}
            - name: prNumber
              value: ${{ outputs['publish::result']?.prNumber ?? 0 }}
            - name: promotionAsNoOp
              value: ${{ outputs['publish::result']?.promotionAsNoOp ?? '' }}
            - name: mergeMode
              value: ${{ vars.mergeMode }}
        - task:
            name: verify-argocd-deployment
          as: verify-deployment
          vars:
            - name: mergeConfirmed
              value: ${{ outputs['merge::result']?.mergeConfirmed ?? '' }}
            - name: commitSHA
              value: ${{ outputs['merge::result']?.mergeCommitSHA ?? '' }}
            - name: component
              value: ${{ vars.component }}
            - name: clusters
              value: stone-stg-rh01|stone-stage-p01
