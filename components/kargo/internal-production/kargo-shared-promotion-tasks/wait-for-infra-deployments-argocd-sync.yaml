---
# wait-for-infra-deployments-argocd-sync
#
# Only applies to components using Ring Deployments via the
# redhat-appstudio/infra-deployments repository and its ArgoCD instance.
#
# Verifies that an ArgoCD Application has synced a specific commit and is healthy.
# Used during Kargo promotions to confirm the promoted commit is live on target clusters
# before advancing to the next ring.
#
# Polls the ArgoCD Application API (via in-cluster Kubernetes API) until:
#   - All matching apps are Synced + Healthy with the expected commit
#   - OR fails fast on auth errors, missing apps, Degraded health, or Failed operations
#
# Vars:
#   commitSHA (required)        — expected git revision to verify (if no-op, empty string)
#   component (required)        — component name prefix (apps match: <component>-<cluster>)
#   clusters (required)         — pipe-separated cluster list (e.g. "stone-stg-rh01|stone-stage-p01")
#   promotionAsNoOp (required)  — whether or not the promotion is a no-op; skips all steps when true (e.g. no-op promotions)
#   appsNamespace (optional)    — ArgoCD namespace (default: argocd-infra-deployments)
#   tokenSecret (required)      — name of the Secret containing the ArgoCD bearer token
#
# Outputs:
#   appDetails — per-app health and commit summary
#   lastCommit — the synced revision of the first matched app
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: wait-for-infra-deployments-argocd-sync
spec:
  vars:
    - name: commitSHA
    - name: component
    - name: clusters
    - name: promotionAsNoOp
      value: "false" # TODO: remove this default value once all promotions have been updated to set the promotionAsNoOp var
    - name: appsNamespace
      value: argocd-infra-deployments
    - name: tokenSecret

  steps:
    - uses: http
      as: wait-for-all-healthy
      if: ${{ !vars.promotionAsNoOp }}
      retry:
        timeout: 15m0s
        errorThreshold: 3
      config:
        method: GET
        url: https://kubernetes.default.svc/apis/argoproj.io/v1alpha1/namespaces/${{ vars.appsNamespace }}/applications
        headers:
          - name: Authorization
            value: Bearer ${{ secret(vars.tokenSecret).token }}
        insecureSkipTLSVerify: true
        successExpression: |
          response.status == 200 &&
          len(filter(response.body.items, {.metadata.name matches '^${{ vars.component }}-(${{ vars.clusters }})$'})) > 0 &&
          all(
            filter(response.body.items, {.metadata.name matches '^${{ vars.component }}-(${{ vars.clusters }})$'}),
            {
              .status?.sync?.status == 'Synced' &&
              .status?.health?.status == 'Healthy' &&
              (
                .status?.sync?.revision == '${{ vars.commitSHA }}' ||
                any(.status?.history ?? [], {.revision == '${{ vars.commitSHA }}'})
              )
            }
          )
        failureExpression: |
          response.status in [401, 403] ||
          (response.status == 200 &&
          (filter(response.body.items, {.metadata.name matches '^${{ vars.component }}-(${{ vars.clusters }})$'}) == [] ||
          any(
            filter(response.body.items, {.metadata.name matches '^${{ vars.component }}-(${{ vars.clusters }})$'}),
            {
              .status?.health?.status == 'Degraded' ||
              .status?.operationState?.phase in ['Failed', 'Error']
            }
          )))
        outputs:
          - name: appDetails
            fromExpression: |
              map(
                filter(response.body.items, {.metadata.name matches '^${{ vars.component }}-(${{ vars.clusters }})$'}),
                {.metadata.name + ' | health=' + (.status?.health?.status ?? 'unknown') + ' | commit=' + (.status?.sync?.revision ?? 'unknown')}
              )
          - name: lastCommit
            fromExpression: |
              len(filter(response.body.items, {.metadata.name matches '^${{ vars.component }}-(${{ vars.clusters }})$'})) > 0 ?
                (filter(response.body.items, {.metadata.name matches '^${{ vars.component }}-(${{ vars.clusters }})$'})[0].status?.sync?.revision ?? 'unknown') :
                'unknown'

    - uses: compose-output
      as: output
      if: ${{ !vars.promotionAsNoOp }}
      config:
        appDetails: ${{ task.outputs['wait-for-all-healthy'].appDetails }}
        lastCommit: ${{ task.outputs['wait-for-all-healthy'].lastCommit }}
