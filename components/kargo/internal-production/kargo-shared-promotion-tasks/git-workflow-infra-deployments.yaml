---
# git-workflow-infra-deployments
#
# Shared PromotionTask that handles the entire post-commit git workflow:
# push → open PR → CI gate → find PR → merge/wait → ArgoCD sync
#
# Replaces ~90 lines of boilerplate per stage with a single task reference.
# Supports two merge modes:
#   - "auto"   (ring 0-1): CI passes → auto-merge → ArgoCD sync
#   - "manual" (ring 2+):  CI passes → wait for human merge → verify merged
#
# Vars:
#   srcPath (required)        — path to the cloned repo
#   repoURL (required)        — GitHub repo URL
#   component (required)      — component name for branch/PR naming
#   targetRing (required)     — target ring (ring-0, ring-1, etc.)
#   promotionAsNoOp (required)— "yes" to skip all steps
#   mergeMode                 — "auto" (default) or "manual"
#   skipProwChecks            — "true" to skip prow (default: "true")
#   requiredProwChecks        — prow check regex (default: ".*")
#   clusters                  — ArgoCD cluster regex for sync (default: "")
#   tokenSecret               — ArgoCD token secret name (default: "argocd-app-reader-token-staging")
#   skipSync                  — "true" to skip ArgoCD sync (default: "false")
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: git-workflow-infra-deployments
spec:
  vars:
    - name: srcPath
    - name: repoURL
      value: https://github.com/redhat-appstudio/infra-deployments.git
    - name: component
    - name: targetRing
    - name: promotionAsNoOp
    - name: mergeMode
      value: "auto"
    - name: skipProwChecks
      value: "true"
    - name: requiredProwChecks
      value: ".*"
    - name: clusters
      value: ""
    - name: tokenSecret
      value: argocd-app-reader-token-staging
    - name: skipSync
      value: "false"
  steps:
    # ── Push to promotion branch ──
    - uses: git-push
      as: push
      if: ${{ vars.promotionAsNoOp != 'yes' }}
      config:
        path: ${{ vars.srcPath }}
        targetBranch: ${{ ctx.project }}/${{ vars.component }}/${{ vars.targetRing }}
        force: true

    # ── Open PR ──
    - uses: git-open-pr
      as: open-pr
      if: ${{ vars.promotionAsNoOp != 'yes' }}
      continueOnError: true
      config:
        repoURL: ${{ vars.repoURL }}
        sourceBranch: ${{ ctx.project }}/${{ vars.component }}/${{ vars.targetRing }}
        targetBranch: main
        title: "chore(${{ ctx.stage }}): promote ${{ vars.component }} to ${{ vars.targetRing }}"
        description: "Promotes ${{ vars.component }} to ${{ vars.targetRing }} in ${{ ctx.project }}. Freight: ${{ ctx.targetFreight.alias }}."
        labels:
          - ${{ vars.targetRing }}
          - component/${{ vars.component }}

    # ── CI Gate: GitHub Actions check runs ──
    - uses: http
      as: wait-for-check-runs
      if: ${{ vars.promotionAsNoOp != 'yes' }}
      retry:
        timeout: 2h30m
      config:
        method: GET
        url: https://api.github.com/repos/redhat-appstudio/infra-deployments/commits/${{ outputs['push'].commit }}/check-runs
        headers:
          - name: Authorization
            value: Bearer ${{ sharedSecret('konflux-kargo-git-operations').github_pat }}
          - name: Accept
            value: application/vnd.github+json
        successExpression: |
          response.status == 200 &&
          len(filter(response.body.check_runs, {.name matches '.*'})) > 0 &&
          all(filter(response.body.check_runs, {.name matches '.*'}), {.conclusion in ['success', 'neutral', 'skipped']})
        failureExpression: |
          response.status in [401, 403, 404] ||
          (response.status == 200 &&
          len(filter(response.body.check_runs, {.name matches '.*'})) > 0 &&
          any(filter(response.body.check_runs, {.name matches '.*'}), {.conclusion in ['failure', 'cancelled', 'timed_out', 'action_required', 'stale']}))
        timeout: 30s

    # ── CI Gate: Prow status checks ──
    - uses: http
      as: wait-for-prow-checks
      if: ${{ vars.skipProwChecks != 'true' && vars.promotionAsNoOp != 'yes' }}
      retry:
        timeout: 2h30m
      config:
        method: GET
        url: https://api.github.com/repos/redhat-appstudio/infra-deployments/commits/${{ outputs['push'].commit }}/status
        headers:
          - name: Authorization
            value: Bearer ${{ sharedSecret('konflux-kargo-git-operations').github_pat }}
          - name: Accept
            value: application/vnd.github+json
        successExpression: |
          response.status == 200 &&
          len(filter(response.body.statuses, {.context != 'tide' && (.context matches '${{ vars.requiredProwChecks }}')})) > 0 &&
          all(filter(response.body.statuses, {.context != 'tide' && (.context matches '${{ vars.requiredProwChecks }}')}), {.state == 'success'})
        failureExpression: |
          response.status in [401, 403, 404] ||
          (response.status == 200 &&
          len(filter(response.body.statuses, {.context != 'tide' && (.context matches '${{ vars.requiredProwChecks }}')})) > 0 &&
          any(filter(response.body.statuses, {.context != 'tide' && (.context matches '${{ vars.requiredProwChecks }}')}), {.state in ['failure', 'error']}))
        timeout: 30s

    # ── CI Gate result output ──
    - uses: compose-output
      as: ci-result
      if: ${{ status('wait-for-check-runs') == 'Succeeded' && (status('wait-for-prow-checks') == 'Succeeded' || status('wait-for-prow-checks') == 'Skipped') }}
      config:
        passed: "yes"

    # ── Find the open PR ──
    - uses: http
      as: find-pr
      if: ${{ vars.promotionAsNoOp != 'yes' && status('wait-for-check-runs') == 'Succeeded' }}
      retry:
        timeout: 5m0s
        errorThreshold: 10
      config:
        method: GET
        url: https://api.github.com/repos/redhat-appstudio/infra-deployments/pulls?head=redhat-appstudio:${{ ctx.project }}/${{ vars.component }}/${{ vars.targetRing }}&state=open
        headers:
          - name: Authorization
            value: Bearer ${{ sharedSecret('konflux-kargo-git-operations').github_pat }}
          - name: Accept
            value: application/vnd.github+json
        outputs:
          - name: prNumber
            fromExpression: response.body[0].number
        successExpression: response.status == 200 && len(response.body) > 0
        timeout: 30s

    # ── Auto-merge mode: merge the PR ──
    - uses: git-merge-pr
      as: auto-merge
      if: ${{ vars.mergeMode != 'manual' && vars.promotionAsNoOp != 'yes' && status('wait-for-check-runs') == 'Succeeded' }}
      retry:
        timeout: 2h0m0s
      config:
        repoURL: ${{ vars.repoURL }}
        prNumber: ${{ outputs['find-pr'].prNumber }}
        mergeMethod: squash
        wait: true

    # ── Manual-merge mode: wait for human to merge ──
    - uses: git-wait-for-pr
      as: wait-for-manual-merge
      if: ${{ vars.mergeMode == 'manual' && vars.promotionAsNoOp != 'yes' && status('wait-for-check-runs') == 'Succeeded' }}
      retry:
        timeout: 168h0m0s
      config:
        repoURL: ${{ vars.repoURL }}
        prNumber: ${{ outputs['find-pr'].prNumber }}

    # ── Manual-merge mode: verify PR was actually merged ──
    - uses: http
      as: verify-merged
      if: ${{ vars.mergeMode == 'manual' && vars.promotionAsNoOp != 'yes' && status('wait-for-check-runs') == 'Succeeded' }}
      config:
        method: GET
        url: https://api.github.com/repos/redhat-appstudio/infra-deployments/pulls/${{ outputs['find-pr'].prNumber }}
        headers:
          - name: Authorization
            value: Bearer ${{ sharedSecret('konflux-kargo-git-operations').github_pat }}
          - name: Accept
            value: application/vnd.github+json
        outputs:
          - name: mergeCommitSHA
            fromExpression: response.body.merge_commit_sha
        successExpression: response.status == 200 && response.body.merged == true
        failureExpression: response.status == 200 && response.body.state == 'closed' && response.body.merged == false
        timeout: 30s

    # ── ArgoCD sync check ──
    - uses: http
      as: wait-for-sync
      if: ${{ vars.skipSync != 'true' && vars.promotionAsNoOp != 'yes' && vars.clusters != '' && status('wait-for-check-runs') == 'Succeeded' }}
      retry:
        timeout: 15m0s
        errorThreshold: 3
      config:
        method: GET
        url: https://kubernetes.default.svc/apis/argoproj.io/v1alpha1/namespaces/argocd-infra-deployments/applications
        insecureSkipTLSVerify: true
        headers:
          - name: Authorization
            value: Bearer ${{ secret(vars.tokenSecret).token }}
        successExpression: |
          response.status == 200 &&
          len(filter(response.body.items, {.metadata.name matches ('^' + vars.component + '-(' + vars.clusters + ')$')})) > 0 &&
          all(
            filter(response.body.items, {.metadata.name matches ('^' + vars.component + '-(' + vars.clusters + ')$')}),
            {
              .status?.sync?.status == 'Synced' &&
              .status?.health?.status == 'Healthy'
            }
          )
        failureExpression: |
          response.status in [401, 403]
        timeout: 30s
