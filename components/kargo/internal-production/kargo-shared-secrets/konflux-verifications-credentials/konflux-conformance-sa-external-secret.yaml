---
# E2E connection secrets required to run Konflux conformance tests from
# github.com/konflux-ci/konflux-ci. Syncs SA tokens per cluster
# from Vault. New clusters are picked up automatically when their Vault
# key matches the pattern.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: konflux-conformance-sa
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  dataFrom:
    - find:
        path: production/devprod
        name:
          regexp: "^production/devprod/konflux-conformance-.*"
        decodingStrategy: None
      rewrite:
        - regexp:
            source: "production/devprod/(.*)"
            target: "$1"
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: appsre-stonesoup-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    name: konflux-conformance-sa
    template:
      metadata:
        annotations:
          kargo.akuity.io/replicate-to: "*"
        labels:
          kargo.akuity.io/cred-type: generic
