---
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: wait-for-ci
spec:
  vars:
    - name: commitSHA
    - name: promotionAsNoOp
    - name: repoOwner
      value: redhat-appstudio
    - name: repoName
      value: infra-common-deployments
  steps:
    - uses: http
      as: wait-for-check-runs
      if: ${{ vars.promotionAsNoOp != 'yes' }}
      retry:
        timeout: 2h
        errorThreshold: 240
      config:
        method: GET
        url: https://api.github.com/repos/${{ vars.repoOwner }}/${{ vars.repoName }}/commits/${{ vars.commitSHA }}/check-runs
        headers:
          - name: Authorization
            value: Bearer ${{ secret('kargo-common-infra-test-secrets').github_pat }}
          - name: Accept
            value: application/vnd.github+json
        successExpression: |
          response.status == 200 &&
          len(response.body.check_runs) > 0 &&
          all(response.body.check_runs, {.conclusion == 'success'})
        timeout: 30s
