apiVersion: builtin
kind: HelmChartInflationGenerator
metadata:
  name: kargo
name: kargo
repo: oci://ghcr.io/akuity/kargo-charts
version: 1.11.2
namespace: kargo
releaseName: kargo
valuesInline:
