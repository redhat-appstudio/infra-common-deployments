---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: regenerate-bundle-universal-repository-gitlab-webhook-config
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: staging/operator-foundry/iib-qe/regenerate-bundle-universal-repository-gitlab-webhook-config
        metadataPolicy: None
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: appsre-stonesoup-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    name: regenerate-bundle-universal-repository-gitlab-webhook-config
