---
# SA used by ring-1 promotions (via Vault → control-plane ExternalSecret) to
# list/get Argo CD Applications from the staging apiserver (kubernetes.default.svc).
# Role is namespaced to argocd-infra-deployments (least privilege).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kargo-infra-deployments-argocd-app-reader-staging
  namespace: kargo-shard-infra-deployments
---
apiVersion: v1
kind: Secret
metadata:
  name: kargo-infra-deployments-argocd-app-reader-token-staging
  namespace: kargo-shard-infra-deployments
  annotations:
    kubernetes.io/service-account.name: kargo-infra-deployments-argocd-app-reader-staging
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kargo-infra-deployments-argocd-app-reader-staging
  namespace: argocd-infra-deployments
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kargo-infra-deployments-argocd-app-reader-staging
  namespace: argocd-infra-deployments
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kargo-infra-deployments-argocd-app-reader-staging
subjects:
  - kind: ServiceAccount
    name: kargo-infra-deployments-argocd-app-reader-staging
    namespace: kargo-shard-infra-deployments
