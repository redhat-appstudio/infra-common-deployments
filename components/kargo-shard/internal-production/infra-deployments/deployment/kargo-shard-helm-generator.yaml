apiVersion: builtin
kind: HelmChartInflationGenerator
metadata:
  name: kargo-shard-infra-deployments-production
name: kargo
repo: oci://ghcr.io/akuity/kargo-charts
version: 1.12.3
namespace: kargo-shard-infra-deployments-production
releaseName: kargo-shard-infra-deployments-production
valuesInline:
  image:
    repository: quay.io/konflux-ci/kargo
    tag: v1.12.3-0-gd544d7c6a
  # Controller-only shard: full Kargo on this cluster owns the data plane
  # (CRDs, ClusterRoles, webhooks, shared namespaces). Avoid SharedResourceWarning.
  api:
    enabled: false
  webhooksServer:
    enabled: false
  externalWebhooksServer:
    enabled: false
  garbageCollector:
    enabled: false
  managementController:
    enabled: false
  webhooks:
    register: false
  crds:
    install: false
  rbac:
    installClusterRoles: false
    installClusterRoleBindings: false
  global:
    # Heartbeats must be written where the production Kargo API reads them.
    kargoNamespace: kargo
    createClusterSecretsNamespace: false
    systemResources:
      createNamespace: false
    sharedResources:
      createNamespace: false
  controller:
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        memory: 4Gi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          monitoring.rhobs/stack: appstudio-federate-ms
    shardName: infra-deployments-production
    gitClient:
      name: Kargo
      email: no-reply@redhat.com
      pushIntegrationPolicy: RebaseOrMerge
      signingKeySecret:
        name: kargo-git-signing-key
        type: gpg
    argocd:
      integrationEnabled: true
      namespace: argocd-infra-deployments
      watchArgocdNamespaceOnly: true
    rollouts:
      integrationEnabled: true
      # Same isolation as the production control plane: AnalysisRuns are
      # labeled for the RolloutManager with --instance-id=kargo.
      controllerInstanceID: kargo
  kubeconfigSecrets:
    kargo: production-kargo-kubeconfig
