---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: appsre-stonesoup-vault
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: "https://vault.ci.ext.devshift.net"
      path: stonesoup
      version: v2
      auth:
        # VaultAppRole authenticates with Vault using the
        # App Role auth mechanism
        # https://www.vaultproject.io/docs/auth/approle
        appRole:
          # Path where the App Role authentication backend is mounted
          path: approle
          # RoleID configured in the App Role authentication backend
          roleId: c2819d5d-99ce-5c20-fce0-0ce373cd25c4
          # Reference to a key in a K8 Secret that contains the App Role SecretId
          secretRef:
            name: appsre-vault
            key: secret-id
            namespace: appsre-vault
  conditions:
    - namespaces:
        - advisories
        - appstudio-monitoring
        - argocd
        - argocd-infra-deployments
        - argocd-staging
        - argocd-tenants-config
        - internal-services
        - iib
        - iib-qe
        - konflux-devlake
        - openshift-logging
        - konflux-support-ops
        - konflux-support-ops-dashboard
        - rover-group-sync
        - argocd-local # Must be the namespace where ArgoCD is deployed
        - kargo
        - kargo-common-infra-test
        - kargo-infra-common
        - kargo-infra-deployments
        - kargo-shared-resources
        - kargo-shard-infra-common-deployments
        - kargo-shard-infra-deployments
        - kargo-shard-infra-deployments-production
        - kargo-konflux-core
        - kargo-konflux-infrastructure
        - kargo-konflux-monitoring
        - kargo-konflux-vanguard
        - kargo-konflux-release
        - konflux-public-staging
        - konflux-public-production
        - spre-automations
