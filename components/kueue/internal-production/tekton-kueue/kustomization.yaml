---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- https://github.com/openshift-pipelines/tekton-kueue/upstream/config/default?ref=538d92693cf7f4995276ff68e07c3d9763642890

images:
- name: ghcr.io/tektoncd/tekton-kueue
  newName: quay.io/openshift-pipeline/pipelines-scheduler-rhel9
  newTag: 538d92693cf7f4995276ff68e07c3d9763642890

namespace: tekton-kueue

commonAnnotations:
  argocd.argoproj.io/sync-wave: "10"

configMapGenerator:
- name: tekton-kueue-config
  namespace: tekton-kueue
  behavior: replace
  files:
  - config.yaml

generatorOptions:
  disableNameSuffixHash: true

patches:
- path: controller-patch.yaml
  target:
    group: apps
    kind: Deployment
    name: tekton-kueue-controller-manager
    version: v1
- path: webhook-patch.yaml
  target:
    group: apps
    kind: Deployment
    name: tekton-kueue-webhook
    version: v1
- target:
    kind: Namespace
    name: tekton-kueue
  patch: |-
    - op: add
      path: /metadata/labels/openshift.io~1cluster-monitoring
      value: "true"
