---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iib-pipelinerun-reader-token-creator
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      - iib-pipelinerun-reader
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iib-pipelinerun-reader-token-creator
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: konflux-operator-foundry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iib-pipelinerun-reader-token-creator
