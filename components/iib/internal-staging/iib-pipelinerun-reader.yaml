---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iib-pipelinerun-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iib-pipelinerun-reader
rules:
  - apiGroups:
      - tekton.dev
    resources:
      - pipelineruns
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iib-pipelinerun-reader
subjects:
  - kind: ServiceAccount
    name: iib-pipelinerun-reader
    namespace: iib
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iib-pipelinerun-reader
