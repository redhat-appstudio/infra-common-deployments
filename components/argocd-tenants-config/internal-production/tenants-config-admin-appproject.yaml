apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tenants-config-admin
  # Finalizer that ensures that project is not deleted until it is not referenced by any application
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Manage Konflux admin configurations for users using ArgoCD
  sourceRepos:
    - https://gitlab.cee.redhat.com/releng/konflux-release-data.git
  # Only permit applications to deploy to the guestbook namespace in the same cluster
  # Destination clusters can be identified by 'server', 'name', or both.
  destinations:
    - namespace: '*-tenant'
      name: stone-prd-rh01
    - namespace: 'rh-managed-*-tenant'
      name: stone-prd-rh01
    - namespace: 'rhtap-releng-tenant'
      name: stone-prd-rh01
    - namespace: '*-tenant'
      name: stone-prod-p01
    - namespace: 'rh-managed-*-tenant'
      name: stone-prod-p01
    - namespace: 'rhtap-releng-tenant'
      name: stone-prod-p01
    - namespace: '*-tenant'
      name: stone-prod-p02
    - namespace: 'rh-managed-*-tenant'
      name: stone-prod-p02
    - namespace: 'rhtap-releng-tenant'
      name: stone-prod-p02
    - namespace: '*-tenant'
      name: kflux-ocp-p01
    - namespace: 'rh-managed-*-tenant'
      name: kflux-ocp-p01
    - namespace: 'rhtap-releng-tenant'
      name: kflux-ocp-p01
    - namespace: '*-tenant'
      name: kflux-prd-rh02
    - namespace: 'rh-managed-*-tenant'
      name: kflux-prd-rh02
    - namespace: 'rhtap-releng-tenant'
      name: kflux-prd-rh02
    - namespace: '*-tenant'
      name: kflux-prd-rh03
    - namespace: 'rh-managed-*-tenant'
      name: kflux-prd-rh03
    - namespace: 'rhtap-releng-tenant'
      name: kflux-prd-rh03
    - namespace: '*-tenant'
      name: kflux-rhel-p01
    - namespace: rh-managed-*-tenant
      name: kflux-rhel-p01
    - namespace: rhtap-releng-tenant
      name: kflux-rhel-p01
    - namespace: '*-tenant'
      name: kflux-osp-p01
    - namespace: rh-managed-*-tenant
      name: kflux-osp-p01
    - namespace: rhtap-releng-tenant
      name: kflux-osp-p01
  # Deny all namespaced-scoped resources from being created, except for the following
  namespaceResourceWhitelist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # Enables namespace orphaned resource monitoring.
  orphanedResources:
    warn: false
