apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: managed-tenant-config
spec:
  generators:
    - git:
        repoURL: https://gitlab.cee.redhat.com/releng/konflux-release-data.git
        revision: main
        directories:
          - path: tenants-config/auto-generated/cluster/kflux-ocp-p01/managed-tenant/art-token-broker
  template:
    metadata:
      name: '{{path.basename}}-managed-tenant-{{path[3]}}'
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
    spec:
      project: managed-tenant-config
      source:
        path: '{{path}}'
        repoURL: https://gitlab.cee.redhat.com/releng/konflux-release-data.git
        targetRevision: main
      destination:
        namespace: '{{path.basename}}'
        name: '{{path[3]}}'
      ignoreDifferences:
        - group: "*"
          kind: "*"
          jsonPointers:
            - /metadata/resourceVersion
        - group: ""
          kind: ServiceAccount
          jsonPointers:
            - /secrets
            - /imagePullSecrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
