apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kflux-stg-p02-es
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    argocd.argoproj.io/secret-type: cluster
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: staging/platform/terraform/generated/kflux-stg-p02/kflux-stg-p02
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: appsre-stonesoup-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    name: kflux-stg-p02-secret
    template:
      engineVersion: v2
      # Keep Replace (not Merge): ApplicationSet-selecting labels must match this
      # template exactly. Merge can leave stale labels on the Secret after removals
      # (see #942), so Apps keep matching when they should not.
      mergePolicy: Replace
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
          appstudio.redhat.com/cluster-type: tenant
          appstudio.redhat.com/internal-cluster: "true"
          appstudio.redhat.com/backup: 'true'
