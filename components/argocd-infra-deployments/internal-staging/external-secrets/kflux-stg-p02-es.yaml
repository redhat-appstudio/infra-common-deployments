apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kflux-stg-p02-es
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    argocd.argoproj.io/secret-type: cluster
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: staging/platform/terraform/generated/kflux-stg-p02/kflux-stg-p02
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: appsre-stonesoup-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    name: kflux-stg-p02-secret
    template:
      engineVersion: v2
      # Replace so removed AppSet-selecting labels are dropped from the Secret
      # (Merge can leave stale labels and Applications keep matching).
      mergePolicy: Replace
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
