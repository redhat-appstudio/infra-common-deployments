---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: konflux-devlake

resources:
- ../base
- ../base/oauth2-proxy
- external-secrets
- https://github.com/konflux-ci/konflux-devlake-mcp.git/k8s?ref=32a714c0bc85fbae0e9d299e28708ceb4dce91bd

patches:
- path: configmap-patch.yaml
- path: prod-deployment-patch.yaml

helmCharts:
- name: devlake
  repo: https://apache.github.io/devlake-helm-chart
  version: 1.0.2
  releaseName: konflux-devlake
  namespace: konflux-devlake
  valuesFile: helm-values.yaml
  includeCRDs: true

images:
- name: quay.io/konflux-ci/konflux-devprod/devlake-mcp-server
  newName: quay.io/konflux-ci/konflux-devprod/devlake-mcp-server
  newTag: 32a714c0bc85fbae0e9d299e28708ceb4dce91bd

commonAnnotations:
  argocd.argoproj.io/sync-wave: "-1"
