---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd-local
resources:
  - ../../base/all-clusters
  - ../../base/external
patches:
  # Enable cert-manager here after it has been validated in external staging.
  - path: patches/cert-manager-patch.yaml
  - path: environment-patch.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
