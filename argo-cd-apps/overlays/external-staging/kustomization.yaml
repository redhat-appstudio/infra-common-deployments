---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd-local
resources:
  - ../../base/all-clusters
  - ../../base/external
  # Stage the Operator prerequisite before promoting external-production.
  - ../../base/external/cert-manager
  - dummy-deployment.yaml
patches:
  - path: environment-patch.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
