---
# Staging-only patch for the kyverno ApplicationSet.
# Lets ArgoCD accept kyverno 3.9.x by suppressing CRD drift caused by the
# kyverno controller mutating CRD .spec fields and OpenShift server-side
# field defaulting. See infra-deployments PR #13731 / KFLUXINFRA-4619.
# When kyverno is promoted to production, delete this patch and fold these
# changes into the base appset (argo-cd-apps/base/internal/kyverno/appset.yaml).
- op: add
  path: /spec/template/metadata/annotations
  value:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
- op: add
  path: /spec/template/spec/ignoreDifferences
  value:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.kyverno.io'
      jqPathExpressions:
        - .spec.preserveUnknownFields
        - .spec.conversion
        - .spec.versions[].schema.openAPIV3Schema
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.wgpolicyk8s.io'
      jqPathExpressions:
        - .spec.preserveUnknownFields
        - .spec.conversion
        - .spec.versions[].schema.openAPIV3Schema
- op: add
  path: /spec/template/spec/syncPolicy/syncOptions/-
  value: RespectIgnoreDifferences=true
