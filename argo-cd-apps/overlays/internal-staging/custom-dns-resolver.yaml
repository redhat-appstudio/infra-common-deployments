---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: custom-dns-resolver
spec:
  generators:
    - clusters:
        values:
          sourceRoot: configs/custom-dns-resolver
          environment: ""
  template:
    metadata:
      name: custom-dns-resolver-{{nameNormalized}}
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/{{values.environment}}'
        repoURL: https://github.com/redhat-appstudio/infra-common-deployments.git
        targetRevision: main
      destination:
        name: in-cluster
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: -1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
