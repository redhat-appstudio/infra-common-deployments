---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd-local
resources:
  - ../../base/all-clusters
  - ../../base/internal
  - argo-rollouts.yaml
  - dummy-deployment.yaml
  - kargo-shard-infra-common-deployments.yaml
  - kargo-shard-infra-deployments.yaml
  - monitoring-workload-custom-kube-state-metrics
patches:
  - path: environment-patch.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
